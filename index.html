<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apna Creator AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.container{
  max-width:1000px;
  margin:0 auto;
  padding:24px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
}

textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccd4df;
  border-radius:10px;
  font-size:15px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#2563eb;
  color:#fff;
  width:100%;
  margin-top:16px;
}

.status{
  padding:12px;
  border-radius:10px;
  background:#eef4ff;
  margin-top:15px;
  white-space:pre-wrap;
  line-height:1.5;
}

.error{
  background:#fff0f0;
  color:#a40000;
}

.success{
  background:#ecfdf5;
  color:#166534;
}

.scene{
  border:1px solid #dce3ec;
  border-radius:14px;
  padding:16px;
  margin:14px 0;
  background:#fff;
}

.scene h3{
  margin:0 0 12px;
}

.scene p{
  line-height:1.5;
  margin:8px 0;
}

.image-box{
  min-height:240px;
  background:#f1f4f8;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-top:14px;
  color:#64748b;
  text-align:center;
  padding:10px;
}

.image-box img{
  width:100%;
  height:auto;
  display:block;
  border-radius:10px;
}

.image-status{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  background:#f8fafc;
  font-size:14px;
  color:#475569;
}

.image-success{
  background:#ecfdf5;
  color:#166534;
}

.image-error{
  background:#fff0f0;
  color:#a40000;
}

.small{
  font-size:13px;
  color:#64748b;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
}

.loading{
  padding:20px;
  text-align:center;
  font-weight:700;
  color:#2563eb;
}

.progress{
  margin-top:12px;
  height:10px;
  background:#e2e8f0;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#2563eb;
  transition:width .3s ease;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🎬 Apna Creator AI</h1>

    <p>
      तुमची Story द्या → 8 Scenes तयार करा → 8 Cartoon Images आपोआप तयार करा.
    </p>

    <label for="story">
      तुमची Story
    </label>

    <textarea
      id="story"
      placeholder="उदा. एक छोटा मुलगा जंगलात जातो आणि त्याला बोलणारा पोपट भेटतो."
    ></textarea>

    <label for="language">
      Language
    </label>

    <select id="language">
      <option value="Hindi">Hindi</option>
      <option value="Marathi" selected>Marathi</option>
      <option value="English">English</option>
    </select>

    <label for="duration">
      Duration
    </label>

    <select id="duration">
      <option value="1 Minute">1 Minute</option>
      <option value="2 Minutes">2 Minutes</option>
      <option value="3 Minutes">3 Minutes</option>
    </select>

    <label for="style">
      Cartoon Style
    </label>

    <select id="style">
      <option value="3D Cartoon">3D Cartoon</option>
      <option value="2D Cartoon">2D Cartoon</option>
      <option value="Kids Cartoon">Kids Cartoon</option>
    </select>

    <button
      id="createBtn"
      class="primary"
    >
      🎬 CREATE STORY
    </button>

    <div id="status" class="status">
      Ready.
    </div>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

  </div>


  <div class="card">

    <h2>📖 Generated Story</h2>

    <pre id="storyOutput">Story येथे दिसेल.</pre>

  </div>


  <div class="card">

    <h2>🎨 Scenes & Images</h2>

    <div id="scenesOutput">

      <p class="small">
        CREATE STORY दाबल्यानंतर 8 scenes आणि images येथे दिसतील.
      </p>

    </div>

  </div>

</div>


<script>

/* =====================================================
   BACKEND
===================================================== */

const BACKEND_URL =
"https://apna-creator-ai.apnacreatorai.workers.dev/";


/* =====================================================
   ELEMENTS
===================================================== */

const storyInput =
document.getElementById("story");

const languageInput =
document.getElementById("language");

const durationInput =
document.getElementById("duration");

const styleInput =
document.getElementById("style");

const createBtn =
document.getElementById("createBtn");

const statusBox =
document.getElementById("status");

const storyOutput =
document.getElementById("storyOutput");

const scenesOutput =
document.getElementById("scenesOutput");

const progressBar =
document.getElementById("progressBar");


/* =====================================================
   STATUS
===================================================== */

function setStatus(text,type="normal"){

  statusBox.textContent = text;

  statusBox.className = "status";

  if(type === "error"){
    statusBox.classList.add("error");
  }

  if(type === "success"){
    statusBox.classList.add("success");
  }
}


/* =====================================================
   PROGRESS
===================================================== */

function setProgress(completed,total=8){

  const percent =
    total > 0
      ? Math.round((completed / total) * 100)
      : 0;

  progressBar.style.width =
    percent + "%";
}


/* =====================================================
   EXTRACT STORY FROM ANY BACKEND RESPONSE
===================================================== */

function extractStory(data){

  if(!data){
    return "";
  }

  if(typeof data === "string"){
    return data.trim();
  }

  const possibleFields = [
    data.story,
    data.text,
    data.output,
    data.response,
    data.result,
    data.content
  ];

  for(const value of possibleFields){

    if(typeof value === "string" && value.trim()){
      return value.trim();
    }
  }

  /*
    Some AI APIs return:
    { response: { response: "..." } }
  */

  if(data.response && typeof data.response === "object"){

    const nested =
      extractStory(data.response);

    if(nested){
      return nested;
    }
  }

  /*
    Some APIs return an array.
  */

  if(Array.isArray(data)){

    for(const item of data){

      const nested =
        extractStory(item);

      if(nested){
        return nested;
      }
    }
  }

  return "";
}


/* =====================================================
   CLEAN AI STORY
===================================================== */

function cleanStoryText(text){

  let result =
    String(text || "").trim();


  /*
    Remove markdown code fences.
  */

  result =
    result
      .replace(/```json/gi,"")
      .replace(/```text/gi,"")
      .replace(/```markdown/gi,"")
      .replace(/```/g,"")
      .trim();


  /*
    Remove leading explanation before SCENE 1.
  */

  const scene1 =
    result.match(
      /(?:^|\n)\s*SCENE\s*1\b/i
    );

  if(scene1){

    result =
      result.substring(
        scene1.index + (
          scene1[0].startsWith("\n")
            ? 1
            : 0
        )
      ).trim();

  }


  /*
    Remove unwanted closing text.
  */

  result =
    result
      .replace(
        /\n+\s*(Here is the output|I will make sure|Please let me know|Hope this helps)[\s\S]*$/i,
        ""
      )
      .trim();


  return result;
}


/* =====================================================
   PARSE 8 SCENES
   VERY FLEXIBLE PARSER
===================================================== */

function parseScenes(text){

  const scenes = [];

  const source =
    String(text || "")
      .replace(/\r/g,"")
      .trim();


  /*
    This parser supports:

    SCENE 1
    Visual:
    Voice:

    SCENE 1:
    Visual:
    Voice:

    Scene 1
    Visual:
    Voice:
  */

  const sceneRegex =
    /(?:^|\n)\s*SCENE\s*([1-8])\s*:?\s*\n\s*Visual\s*:\s*([\s\S]*?)\n\s*Voice\s*:\s*([\s\S]*?)(?=\n\s*SCENE\s*[1-8]\s*:?\s*\n|$)/gi;


  let match;

  while(
    (match = sceneRegex.exec(source)) !== null
  ){

    const number =
      Number(match[1]);

    let visual =
      String(match[2] || "")
        .trim();

    let voice =
      String(match[3] || "")
        .trim();


    /*
      Clean visual.
    */

    visual =
      visual
        .replace(/\*\*/g,"")
        .replace(/```/g,"")
        .replace(/\s+/g," ")
        .trim();


    /*
      Clean voice.
    */

    voice =
      voice
        .replace(/\*\*/g,"")
        .replace(/```/g,"")
        .replace(/\s+/g," ")
        .trim();


    /*
      Remove accidental extra AI text.
    */

    voice =
      voice
        .replace(
          /(?:Here is the output|I will make sure|Please let me know|STOP)[\s\S]*$/i,
          ""
        )
        .trim();


    if(
      number >= 1 &&
      number <= 8 &&
      visual &&
      voice
    ){

      scenes.push({
        number,
        visual,
        voice
      });

    }

  }


  /*
    Remove duplicates.
  */

  const unique = [];

  for(const scene of scenes){

    if(
      !unique.some(
        item =>
          item.number === scene.number
      )
    ){

      unique.push(scene);

    }

  }


  unique.sort(
    (a,b) =>
      a.number - b.number
  );


  return unique;
}


/* =====================================================
   RENDER SCENES
===================================================== */

function renderScenes(scenes){

  scenesOutput.innerHTML = "";

  const elements = [];


  for(const scene of scenes){

    const div =
      document.createElement("div");

    div.className = "scene";


    const h =
      document.createElement("h3");

    h.textContent =
      "🎬 SCENE " + scene.number;


    const visual =
      document.createElement("p");

    const visualBold =
      document.createElement("b");

    visualBold.textContent =
      "Visual: ";

    visual.appendChild(
      visualBold
    );

    visual.appendChild(
      document.createTextNode(
        scene.visual
      )
    );


    const voice =
      document.createElement("p");

    const voiceBold =
      document.createElement("b");

    voiceBold.textContent =
      "Voice: ";

    voice.appendChild(
      voiceBold
    );

    voice.appendChild(
      document.createTextNode(
        scene.voice
      )
    );


    const imageBox =
      document.createElement("div");

    imageBox.className =
      "image-box";

    imageBox.textContent =
      "⏳ Image तयार होण्याची वाट पाहत आहे...";


    const imageStatus =
      document.createElement("div");

    imageStatus.className =
      "image-status";

    imageStatus.textContent =
      "⏳ Waiting...";


    div.appendChild(h);
    div.appendChild(visual);
    div.appendChild(voice);
    div.appendChild(imageBox);
    div.appendChild(imageStatus);

    scenesOutput.appendChild(div);


    elements.push({
      imageBox,
      imageStatus
    });

  }


  return elements;
}


/* =====================================================
   GENERATE ONE IMAGE
===================================================== */

async function generateImage(scene,elements){

  elements.imageStatus.className =
    "image-status";

  elements.imageStatus.textContent =
    "🎨 Scene " +
    scene.number +
    " ची image तयार होत आहे...";


  elements.imageBox.innerHTML =
    '<div class="loading">🎨 Image generating...<br>कृपया थांबा.</div>';


  try{

    const response =
      await fetch(
        BACKEND_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            action:"generate-image",

            visual:scene.visual,

            language:languageInput.value,

            style:styleInput.value

          })
        }
      );


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if(!response.ok){

      const errorText =
        await response.text();

      let message =
        "Image generation failed. HTTP " +
        response.status;

      try{

        const errorData =
          JSON.parse(errorText);

        if(errorData.error){
          message =
            errorData.error;
        }

      }
      catch(e){}

      throw new Error(message);
    }


    /*
      Backend must return an image.
    */

    if(
      !contentType.includes("image/")
    ){

      const errorText =
        await response.text();

      throw new Error(
        "Backend ने image ऐवजी response दिला: " +
        errorText.substring(0,300)
      );

    }


    const blob =
      await response.blob();


    const imageURL =
      URL.createObjectURL(blob);


    elements.imageBox.innerHTML =
      "";


    const img =
      document.createElement("img");

    img.src =
      imageURL;

    img.alt =
      "Scene " +
      scene.number +
      " Cartoon Image";


    elements.imageBox.appendChild(img);


    elements.imageStatus.className =
      "image-status image-success";

    elements.imageStatus.textContent =
      "✅ Scene " +
      scene.number +
      " image तयार झाली.";


    return true;

  }
  catch(error){

    console.error(
      "IMAGE ERROR:",
      error
    );


    elements.imageBox.innerHTML =
      "❌ Image तयार झाली नाही.";


    elements.imageStatus.className =
      "image-status image-error";

    elements.imageStatus.textContent =
      "❌ Scene " +
      scene.number +
      " error: " +
      (
        error.message ||
        error
      );


    return false;
  }
}


/* =====================================================
   GENERATE ALL IMAGES
===================================================== */

async function generateAllImages(
  scenes,
  elements
){

  let successCount = 0;
  let failedCount = 0;


  for(let i=0;i<scenes.length;i++){

    const scene =
      scenes[i];


    setStatus(
      "🎨 Images तयार होत आहेत...\n\n" +
      "आत्ता Scene " +
      scene.number +
      " / " +
      scenes.length +
      " तयार होत आहे.\n\n" +
      "तयार: " +
      successCount +
      " / " +
      scenes.length
    );


    const success =
      await generateImage(
        scene,
        elements[i]
      );


    if(success){
      successCount++;
    }
    else{
      failedCount++;
    }


    setProgress(
      i + 1,
      scenes.length
    );

  }


  if(failedCount === 0){

    setStatus(
      "🎉 पूर्ण झाले!\n\n" +
      scenes.length +
      " scenes आणि " +
      scenes.length +
      " images तयार झाल्या.",
      "success"
    );

  }
  else{

    setStatus(
      "⚠️ Image generation पूर्ण झाली.\n\n" +
      "तयार: " +
      successCount +
      " / " +
      scenes.length +
      "\nFailed: " +
      failedCount +
      " / " +
      scenes.length,
      failedCount === scenes.length
        ? "error"
        : "normal"
    );

  }
}


/* =====================================================
   CREATE STORY
===================================================== */

async function createStory(){

  const story =
    storyInput.value.trim();


  if(!story){

    setStatus(
      "कृपया आधी Story लिहा.",
      "error"
    );

    return;
  }


  createBtn.disabled =
    true;

  createBtn.textContent =
    "⏳ STORY + IMAGES तयार होत आहेत...";


  storyOutput.textContent =
    "कृपया थोडा वेळ थांबा...";


  scenesOutput.innerHTML =
    '<div class="loading">🤖 AI 8 scenes तयार करत आहे...</div>';


  setProgress(0,8);


  setStatus(
    "🤖 तुमची Story AI कडे पाठवत आहे...\n\n" +
    "AI तुमच्या Story वरून 8 connected scenes तयार करेल."
  );


  try{

    const response =
      await fetch(
        BACKEND_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            action:"generate-story",

            story:story,

            language:
              languageInput.value,

            duration:
              durationInput.value,

            style:
              styleInput.value

          })
        }
      );


    const raw =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(raw);

    }
    catch(e){

      throw new Error(
        "Backend ने valid JSON दिले नाही.\n\n" +
        raw.substring(0,500)
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "Story generation failed. HTTP " +
        response.status
      );

    }


    /*
      Extract story from different possible
      backend response formats.
    */

    const aiStory =
      extractStory(data);


    if(!aiStory){

      throw new Error(
        "AI response मध्ये story सापडली नाही.\n\n" +
        JSON.stringify(data).substring(0,1000)
      );

    }


    const cleanStory =
      cleanStoryText(aiStory);


    storyOutput.textContent =
      cleanStory;


    /*
      Parse scenes.
    */

    const scenes =
      parseScenes(cleanStory);


    if(scenes.length !== 8){

      throw new Error(
        "AI response मध्ये पूर्ण 8 scenes सापडले नाहीत.\n\n" +
        "मिळाले: " +
        scenes.length +
        " / 8\n\n" +
        "AI response:\n\n" +
        cleanStory.substring(0,3000)
      );

    }


    /*
      Verify scene numbers.
    */

    for(let i=0;i<8;i++){

      if(
        scenes[i].number !== i + 1
      ){

        throw new Error(
          "Scene numbering चुकीचे आहे."
        );

      }
    }


    /*
      Show scenes.
    */

    const elements =
      renderScenes(scenes);


    setStatus(
      "✅ 8 scenes तयार झाले!\n\n" +
      "🎨 आता प्रत्येक Scene च्या Visual वरून image आपोआप तयार होत आहे.\n\n" +
      "Browser बंद करू नका."
    );


    /*
      Generate images one by one.
    */

    await generateAllImages(
      scenes,
      elements
    );

  }
  catch(error){

    console.error(
      "CREATE ERROR:",
      error
    );


    storyOutput.textContent =
      "Story तयार झाली नाही.";


    scenesOutput.innerHTML =
      '<p class="small">❌ Scenes तयार झाले नाहीत.</p>';


    setProgress(0,8);


    setStatus(
      "❌ समस्या आली.\n\n" +
      (
        error.message ||
        error
      ),
      "error"
    );

  }
  finally{

    createBtn.disabled =
      false;

    createBtn.textContent =
      "🎬 CREATE STORY";

  }
}


/* =====================================================
   BUTTON
===================================================== */

createBtn.addEventListener(
  "click",
  createStory
);

</script>

</body>
</html>
