<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Creator AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.container{
  max-width:1000px;
  margin:0 auto;
  padding:24px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
}

textarea,
select,
input{
  width:100%;
  padding:12px;
  border:1px solid #ccd4df;
  border-radius:10px;
  font-size:15px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e8eef8;
  color:#172033;
}

.image-button{
  background:#16a34a;
  color:white;
  width:100%;
  margin-top:12px;
}

.status{
  padding:12px;
  border-radius:10px;
  background:#eef4ff;
  margin-top:15px;
  white-space:pre-wrap;
}

.error{
  background:#fff0f0;
  color:#a40000;
}

.scene{
  border:1px solid #dce3ec;
  border-radius:14px;
  padding:16px;
  margin:12px 0;
}

.scene h3{
  margin:0 0 12px;
}

.scene p{
  line-height:1.5;
}

.image-box{
  min-height:180px;
  background:#f1f4f8;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-top:12px;
  color:#64748b;
  text-align:center;
  padding:10px;
}

.image-box img{
  width:100%;
  height:auto;
  display:block;
  border-radius:10px;
}

.small{
  font-size:13px;
  color:#64748b;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.row button{
  flex:1;
  min-width:180px;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="container">

  <!-- MAIN CARD -->
  <div class="card">

    <h1>🎬 Apna Creator AI</h1>

    <p>
      Story तयार करा → 8 scenes तयार करा → प्रत्येक scene ची Cartoon Image तयार करा.
    </p>

    <label for="story">
      तुमची Story
    </label>

    <textarea
      id="story"
      placeholder="उदा. एक छोटा मुलगा जंगलात फिरायला जातो..."
    ></textarea>

    <label for="language">
      Language
    </label>

    <select id="language">
      <option value="Hindi">Hindi</option>
      <option value="Marathi" selected>Marathi</option>
      <option value="English">English</option>
    </select>

    <label for="duration">
      Duration
    </label>

    <select id="duration">
      <option>1 Minute</option>
      <option>2 Minutes</option>
      <option>3 Minutes</option>
    </select>

    <label for="style">
      Style
    </label>

    <select id="style">
      <option>3D Cartoon</option>
      <option>2D Cartoon</option>
      <option>Kids Cartoon</option>
    </select>

    <div class="row" style="margin-top:16px">

      <button
        id="createBtn"
        class="primary"
      >
        CREATE STORY
      </button>

    </div>

    <div id="status" class="status">
      Ready.
    </div>

  </div>


  <!-- STORY -->
  <div class="card">

    <h2>📖 Generated Story</h2>

    <pre id="storyOutput">
Story येथे दिसेल.
    </pre>

  </div>


  <!-- SCENES -->
  <div class="card">

    <h2>🎨 Scenes & Images</h2>

    <div id="scenesOutput">

      <p class="small">
        Story तयार झाल्यावर 8 scenes येथे दिसतील.
      </p>

    </div>

  </div>

</div>


<script>

/* =========================================
   BACKEND
========================================= */

const BACKEND_URL =
"https://apna-creator-ai.apnacreatorai.workers.dev/";


/* =========================================
   ELEMENTS
========================================= */

const storyInput =
document.getElementById("story");

const languageInput =
document.getElementById("language");

const durationInput =
document.getElementById("duration");

const styleInput =
document.getElementById("style");

const createBtn =
document.getElementById("createBtn");

const statusBox =
document.getElementById("status");

const storyOutput =
document.getElementById("storyOutput");

const scenesOutput =
document.getElementById("scenesOutput");


/* =========================================
   STATUS
========================================= */

function setStatus(text,error=false){

  statusBox.textContent = text;

  statusBox.className =
    error
    ? "status error"
    : "status";

}


/* =========================================
   PARSE 8 SCENES
========================================= */

function parseScenes(text){

  const scenes = [];

  const regex =
  /SCENE\s*([1-8])\s*\nVisual:\s*([\s\S]*?)\nVoice:\s*([\s\S]*?)(?=\n\nSCENE\s*[1-8]\b|$)/gi;

  let match;

  while((match = regex.exec(text || "")) !== null){

    scenes.push({

      number:Number(match[1]),

      visual:match[2]
        .trim(),

      voice:match[3]
        .trim()

    });

  }

  return scenes;
}


/* =========================================
   GENERATE IMAGE
========================================= */

async function generateImage(
  scene,
  imageBox,
  imageButton
){

  imageButton.disabled = true;

  imageButton.textContent =
    "🎨 IMAGE GENERATING...";

  setStatus(
    "🎨 Scene " +
    scene.number +
    " ची image तयार होत आहे..."
  );

  try{

    const response =
    await fetch(
      BACKEND_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          action:"generate-image",

          visual:scene.visual,

          language:
          languageInput.value,

          style:
          styleInput.value

        })

      }
    );


    /* =====================================
       ERROR RESPONSE
    ===================================== */

    if(!response.ok){

      const errorText =
      await response.text();

      let message =
      "Image generation failed. HTTP " +
      response.status;

      try{

        const errorData =
        JSON.parse(errorText);

        if(errorData.error){

          message =
          errorData.error;

        }

      }catch(e){}

      throw new Error(message);

    }


    /* =====================================
       IMAGE RESPONSE
    ===================================== */

    const blob =
    await response.blob();


    if(
      !blob.type ||
      !blob.type.startsWith("image/")
    ){

      throw new Error(
        "Backend ने image ऐवजी दुसरा response दिला."
      );

    }


    const imageURL =
    URL.createObjectURL(blob);


    imageBox.innerHTML = "";


    const img =
    document.createElement("img");


    img.src =
    imageURL;


    img.alt =
    "Scene " +
    scene.number +
    " Cartoon Image";


    imageBox.appendChild(img);


    imageButton.textContent =
    "✅ IMAGE GENERATED";


    setStatus(
      "✅ Scene " +
      scene.number +
      " ची image तयार झाली!"
    );

  }


  catch(error){

    console.error(error);


    imageButton.disabled = false;


    imageButton.textContent =
    "🎨 GENERATE IMAGE";


    setStatus(
      "❌ Scene " +
      scene.number +
      " ची image तयार झाली नाही.\n\nError: " +
      (
        error.message ||
        error
      ),
      true
    );

  }

}


/* =========================================
   RENDER SCENES
========================================= */

function renderScenes(scenes){

  scenesOutput.innerHTML = "";


  scenes.forEach(scene => {

    const div =
    document.createElement("div");

    div.className =
    "scene";


    /* SCENE TITLE */

    const h =
    document.createElement("h3");

    h.textContent =
    "SCENE " +
    scene.number;


    /* VISUAL */

    const visual =
    document.createElement("p");


    const visualBold =
    document.createElement("b");

    visualBold.textContent =
    "Visual: ";


    visual.appendChild(
      visualBold
    );


    visual.appendChild(
      document.createTextNode(
        scene.visual
      )
    );


    /* VOICE */

    const voice =
    document.createElement("p");


    const voiceBold =
    document.createElement("b");

    voiceBold.textContent =
    "Voice: ";


    voice.appendChild(
      voiceBold
    );


    voice.appendChild(
      document.createTextNode(
        scene.voice
      )
    );


    /* IMAGE BOX */

    const imageBox =
    document.createElement("div");

    imageBox.className =
    "image-box";

    imageBox.textContent =
    "🎨 Image येथे दिसेल";


    /* IMAGE BUTTON */

    const imageButton =
    document.createElement("button");

    imageButton.className =
    "image-button";

    imageButton.textContent =
    "🎨 GENERATE IMAGE";


    imageButton.addEventListener(
      "click",
      function(){

        generateImage(
          scene,
          imageBox,
          imageButton
        );

      }
    );


    /* ADD EVERYTHING */

    div.appendChild(h);

    div.appendChild(
      visual
    );

    div.appendChild(
      voice
    );

    div.appendChild(
      imageButton
    );

    div.appendChild(
      imageBox
    );


    scenesOutput.appendChild(
      div
    );

  });

}


/* =========================================
   CREATE STORY
========================================= */

async function createStory(){

  const story =
  storyInput.value.trim();


  if(!story){

    setStatus(
      "कृपया Story लिहा.",
      true
    );

    return;

  }


  createBtn.disabled =
  true;

  createBtn.textContent =
  "CREATING...";


  setStatus(
    "AI कहानी तयार करत आहे..."
  );


  try{

    const response =
    await fetch(
      BACKEND_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          story:story,

          language:
          languageInput.value,

          duration:
          durationInput.value,

          style:
          styleInput.value

        })

      }
    );


    const raw =
    await response.text();


    let data;


    try{

      data =
      JSON.parse(raw);

    }

    catch(e){

      throw new Error(
        "Backend ने valid JSON दिले नाही."
      );

    }


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        (
          "Backend HTTP " +
          response.status
        )
      );

    }


    /* =====================================
       CLEAN STORY
    ===================================== */

    let cleanStory =
    String(
      data.story || ""
    ).trim();


    const scene8Match =
    cleanStory.match(
      /([\s\S]*?SCENE\s*8\s*\nVisual:[\s\S]*?\nVoice:[^\n]*)/i
    );


    if(scene8Match){

      cleanStory =
      scene8Match[1].trim();

    }


    cleanStory =
    cleanStory
      .replace(
        /```(?:text|json)?/gi,
        ""
      )
      .replace(
        /```/g,
        ""
      )
      .trim();


    storyOutput.textContent =
    cleanStory;


    /* =====================================
       PARSE SCENES
    ===================================== */

    const scenes =
    parseScenes(
      cleanStory
    );


    if(
      scenes.length !== 8
    ){

      throw new Error(
        "Story मिळाली, पण 8 scenes पूर्ण मिळाले नाहीत."
      );

    }


    /* =====================================
       SHOW SCENES
    ===================================== */

    renderScenes(
      scenes
    );


    setStatus(
      "✅ AI ने आपकी कहानी तैयार कर दी!\n\n" +
      "8 scenes तयार आहेत.\n" +
      "आता कोणत्याही Scene खाली GENERATE IMAGE दाबा."
    );

  }


  catch(error){

    console.error(error);


    setStatus(
      "❌ AI से कहानी बनाने में समस्या आई.\n\n" +
      "Error: " +
      (
        error.message ||
        error
      ),
      true
    );

  }


  finally{

    createBtn.disabled =
    false;

    createBtn.textContent =
    "CREATE STORY";

  }

}


/* =========================================
   CREATE STORY BUTTON
========================================= */

createBtn.addEventListener(
  "click",
  createStory
);

</script>

</body>
</html>
