<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Creator AI</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182235;font-family:Arial,sans-serif}.container{width:min(100% - 24px,900px);margin:24px auto}.card{background:#fff;border-radius:16px;padding:20px;margin:0 0 16px;box-shadow:0 4px 18px #16243a12}h1{font-size:26px;margin:0 0 8px}h2{font-size:21px;margin:0 0 12px}p{line-height:1.55}.muted{color:#64748b;font-size:13px}label{display:block;font-weight:700;margin:14px 0 6px}textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white}textarea{min-height:130px;resize:vertical}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.primary{width:100%;margin-top:16px;background:#2563eb;color:#fff}.status{margin-top:14px;background:#eff5ff;border-radius:9px;padding:12px;white-space:pre-wrap;line-height:1.5}.status.success,.ok{background:#ecfdf5;color:#166534}.status.error,.bad{background:#fff1f2;color:#9f1239}.progress{margin-top:12px;height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden}.progress-bar{height:100%;width:0;background:#2563eb;transition:width .25s}pre{white-space:pre-wrap;word-break:break-word;line-height:1.55;font:inherit}.scene{border:1px solid #dce4ef;border-radius:13px;padding:15px;margin:14px 0;background:#fff}.scene h3{margin:0 0 10px}.scene p{margin:8px 0}.image-box{min-height:150px;margin-top:12px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#64748b;text-align:center}.image-box img{display:block;width:100%;height:auto}.image-status,.voice-status{margin-top:9px;padding:9px;border-radius:8px;background:#f8fafc;font-size:13px;white-space:pre-wrap}.voice-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.play-btn{background:#16a34a;color:white}.stop-btn{background:#dc2626;color:white}.download-btn{background:#7c3aed;color:white;text-decoration:none;display:inline-block;border-radius:9px;padding:11px 14px;font-weight:700}.loading{padding:20px;color:#2563eb;font-weight:700;text-align:center}audio{display:block;width:100%;margin-top:10px}@media(max-width:600px){.container{width:min(100% - 14px,900px);margin:10px auto}.card{padding:14px}.scene{padding:11px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="container">
  <section class="card">
    <h1>🎬 Apna Creator AI</h1>
    <p class="muted">तुमची Story द्या → 8 connected scenes → 8 Cartoon Images + Voice.</p>
    <label for="story">तुमची Story</label>
    <textarea id="story" placeholder="उदा. एका छोट्या गावात मोनू नावाचा मुलगा राहत होता..."></textarea>
    <label for="language">Language</label>
    <select id="language"><option>Marathi</option><option>Hindi</option><option>English</option></select>
    <label for="duration">Duration</label>
    <select id="duration"><option>1 Minute</option><option>2 Minutes</option><option>3 Minutes</option></select>
    <label for="style">Cartoon Style</label>
    <select id="style"><option>3D Cartoon</option><option>2D Cartoon</option><option>Kids Cartoon</option></select>
    <button id="createBtn" class="primary" type="button">🎬 CREATE STORY</button>
    <div id="status" class="status">Ready.</div>
    <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
  </section>
  <section class="card"><h2>📖 Generated Story</h2><pre id="storyOutput">Story येथे दिसेल.</pre></section>
  <section class="card"><h2>🎨 Scenes + Images + Voice</h2><div id="scenesOutput"><p class="muted">CREATE STORY दाबल्यानंतर 8 scenes येथे दिसतील.</p></div></section>
</div>
<script>
"use strict";
const BACKEND_URL="https://apna-creator-ai.apnacreatorai.workers.dev";
const $=id=>document.getElementById(id);
const storyInput=$("story"),languageInput=$("language"),durationInput=$("duration"),styleInput=$("style"),createBtn=$("createBtn"),statusBox=$("status"),storyOutput=$("storyOutput"),scenesOutput=$("scenesOutput"),progressBar=$("progressBar");
function setStatus(message,type="normal"){statusBox.textContent=message;statusBox.className="status"+(type==="success"?" success":type==="error"?" error":"")}
function setProgress(done,total=8){progressBar.style.width=total?Math.round(done/total*100)+"%":"0%"}
async function readError(response,kind){const body=await response.text();try{const data=JSON.parse(body);return data.error||`${kind} failed (HTTP ${response.status})`}catch{return `${kind} failed (HTTP ${response.status}): ${body.slice(0,350)}`} }
function parseScenes(text){const source=String(text||"").replace(/\r/g,"").trim();const re=/SCENE\s*([1-8])\s*:?\s*\n\s*Visual\s*:\s*([\s\S]*?)\n\s*Voice\s*:\s*([\s\S]*?)(?=\n\s*SCENE\s*[1-8]\b|$)/gi;const map=new Map();let m;while((m=re.exec(source))!==null){const scene={number:Number(m[1]),visual:m[2].trim().replace(/\s+/g," "),voice:m[3].trim().replace(/\s+/g," ")};if(scene.visual&&scene.voice)map.set(scene.number,scene)}return [...map.values()].sort((a,b)=>a.number-b.number)}
function createSceneElements(scene){const card=document.createElement("article");card.className="scene";const title=document.createElement("h3");title.textContent=`🎬 SCENE ${scene.number}`;const visual=document.createElement("p");visual.textContent=`Visual: ${scene.visual}`;const voice=document.createElement("p");voice.textContent=`Voice: ${scene.voice}`;const imageBox=document.createElement("div");imageBox.className="image-box";imageBox.textContent="Image तयार होत आहे...";const imageStatus=document.createElement("div");imageStatus.className="image-status";imageStatus.textContent="Waiting for image";const voiceStatus=document.createElement("div");voiceStatus.className="voice-status";voiceStatus.textContent="Waiting for voice";const controls=document.createElement("div");controls.className="voice-controls";const playBtn=document.createElement("button");playBtn.type="button";playBtn.className="play-btn";playBtn.textContent="▶ Play Voice";playBtn.disabled=true;const stopBtn=document.createElement("button");stopBtn.type="button";stopBtn.className="stop-btn";stopBtn.textContent="■ Stop";stopBtn.disabled=true;const downloadBtn=document.createElement("a");downloadBtn.className="download-btn";downloadBtn.textContent="⬇ Download MP3";downloadBtn.style.display="none";downloadBtn.download=`scene-${scene.number}.mp3`;const audio=document.createElement("audio");audio.controls=true;audio.style.display="none";controls.append(playBtn,stopBtn,downloadBtn);card.append(title,visual,voice,imageBox,imageStatus,voiceStatus,controls,audio);scenesOutput.appendChild(card);return{imageBox,imageStatus,voiceStatus,playBtn,stopBtn,downloadBtn,audio}}
async function blobToSmallReference(blob){const bitmap=await createImageBitmap(blob);const max=480;const scale=Math.min(max/bitmap.width,max/bitmap.height,1);const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const context=canvas.getContext("2d");context.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const small=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error("Reference image resize failed")),"image/jpeg",0.82));const bytes=new Uint8Array(await small.arrayBuffer());let binary="";for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return `data:image/jpeg;base64,${btoa(binary)}`}
async function generateImage(scene,el,story,characterLock,referenceImage){el.imageStatus.className="image-status";el.imageStatus.textContent=`Scene ${scene.number}: generating image...`;el.imageBox.innerHTML="";const loading=document.createElement("div");loading.className="loading";loading.textContent="🎨 Image तयार होत आहे...";el.imageBox.appendChild(loading);try{const response=await fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"generate-image",story,visual:scene.visual,characterLock,style:styleInput.value,sceneNumber:scene.number,referenceImage})});if(!response.ok)throw new Error(await readError(response,"Image generation"));const contentType=response.headers.get("content-type")||"";if(!contentType.startsWith("image/"))throw new Error("Worker ने image ऐवजी वेगळा response दिला.");const blob=await response.blob();if(!blob.size)throw new Error("Image file रिकामी आहे.");const url=URL.createObjectURL(blob);const img=document.createElement("img");img.src=url;img.alt=`Scene ${scene.number} illustration`;el.imageBox.replaceChildren(img);el.imageStatus.className="image-status ok";el.imageStatus.textContent="✅ Image तयार झाली.";return{ok:true,reference:referenceImage||await blobToSmallReference(blob)}}catch(error){el.imageBox.textContent="❌ Image तयार झाली नाही.";el.imageStatus.className="image-status bad";el.imageStatus.textContent=error.message||String(error);console.error("IMAGE ERROR",error);return{ok:false,reference:referenceImage}}}
async function generateVoice(scene,el){el.voiceStatus.className="voice-status";el.voiceStatus.textContent=`Scene ${scene.number}: voice तयार होत आहे...`;el.playBtn.disabled=true;el.stopBtn.disabled=true;el.downloadBtn.style.display="none";try{const response=await fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"generate-voice",text:scene.voice,language:languageInput.value})});if(!response.ok)throw new Error(await readError(response,"Voice generation"));const type=response.headers.get("content-type")||"";if(!type.includes("audio"))throw new Error("Worker ने audio file ऐवजी वेगळा response दिला.");const blob=await response.blob();if(!blob.size)throw new Error("Audio file रिकामी आहे.");const url=URL.createObjectURL(blob);el.audio.src=url;el.playBtn.disabled=false;el.stopBtn.disabled=false;el.downloadBtn.href=url;el.downloadBtn.style.display="inline-block";el.playBtn.onclick=async()=>{try{await el.audio.play()}catch(error){el.voiceStatus.textContent=`Play error: ${error.message||error}`}};el.stopBtn.onclick=()=>{el.audio.pause();el.audio.currentTime=0};el.voiceStatus.className="voice-status ok";el.voiceStatus.textContent="✅ Voice तयार झाली.";return true}catch(error){el.voiceStatus.className="voice-status bad";el.voiceStatus.textContent=error.message||String(error);console.error("VOICE ERROR",error);return false}}
async function generateAll(scenes,elements,story,characterLock){let images=0,voices=0,failures=0,referenceImage="";for(let i=0;i<scenes.length;i++){const scene=scenes[i],el=elements[i];setStatus(`Generating scene ${scene.number}/8\nImages: ${images}/8\nVoices: ${voices}/8`);const imageResult=await generateImage(scene,el,story,characterLock,referenceImage);if(imageResult.ok){images++;if(!referenceImage)referenceImage=imageResult.reference}else failures++;if(await generateVoice(scene,el))voices++;else failures++;setProgress(i+1,scenes.length)}if(images===8&&voices===8)setStatus("🎉 पूर्ण झाले! 8 Images आणि 8 Voices तयार झाले.","success");else setStatus(`Generation पूर्ण.\nImages: ${images}/8\nVoices: ${voices}/8\nFailed tasks: ${failures}\nVoice error असल्यास Cloudflare मधील SPEECH_KEY आणि SPEECH_REGION तपासा.`,failures?"error":"normal")}
async function createStory(){const story=storyInput.value.trim();if(!story){setStatus("कृपया आधी Story लिहा.","error");storyInput.focus();return}createBtn.disabled=true;createBtn.textContent="⏳ तयार होत आहे...";storyOutput.textContent="Story तयार होत आहे...";scenesOutput.replaceChildren();setProgress(0);setStatus("🤖 Story AI कडे पाठवत आहे...");try{const response=await fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"generate-story",story,language:languageInput.value,duration:durationInput.value,style:styleInput.value})});if(!response.ok)throw new Error(await readError(response,"Story generation"));const data=await response.json();if(!data.success)throw new Error(data.error||"Story generation failed");const scenes=Array.isArray(data.scenes)?data.scenes:parseScenes(data.story);const characterLock=String(data.characterLock||"").trim();if(scenes.length!==8)throw new Error(`AI ने ${scenes.length}/8 scenes दिले. पुन्हा प्रयत्न करा.`);if(!characterLock)throw new Error("AI ने Character Lock तयार केला नाही. पुन्हा प्रयत्न करा.");storyOutput.textContent=data.story||scenes.map(s=>`SCENE ${s.number}\nVisual: ${s.visual}\nVoice: ${s.voice}`).join("\n\n");const elements=scenes.map(createSceneElements);setStatus("✅ 8 scenes तयार झाले. आता Images आणि Voice तयार होत आहेत...");await generateAll(scenes,elements,story,characterLock)}catch(error){storyOutput.textContent="Story तयार झाली नाही.";scenesOutput.textContent="❌ Scenes तयार झाले नाहीत.";setProgress(0);setStatus(`❌ ${error.message||error}`,"error");console.error("CREATE STORY ERROR",error)}finally{createBtn.disabled=false;createBtn.textContent="🎬 CREATE STORY"}}
createBtn.addEventListener("click",createStory);
console.log("Apna Creator AI ready");
</script>
</body>
</html>
