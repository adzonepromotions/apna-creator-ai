<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apna Creator AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.container{
  max-width:1000px;
  margin:0 auto;
  padding:24px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
}

textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccd4df;
  border-radius:10px;
  font-size:15px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#2563eb;
  color:white;
  width:100%;
}

.status{
  padding:12px;
  border-radius:10px;
  background:#eef4ff;
  margin-top:15px;
  white-space:pre-wrap;
}

.error{
  background:#fff0f0;
  color:#a40000;
}

.success{
  background:#ecfdf5;
  color:#166534;
}

.scene{
  border:1px solid #dce3ec;
  border-radius:14px;
  padding:16px;
  margin:14px 0;
  background:#fff;
}

.scene h3{
  margin:0 0 12px;
}

.scene p{
  line-height:1.5;
}

.image-box{
  min-height:220px;
  background:#f1f4f8;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-top:12px;
  color:#64748b;
  text-align:center;
  padding:10px;
}

.image-box img{
  width:100%;
  height:auto;
  display:block;
  border-radius:10px;
}

.small{
  font-size:13px;
  color:#64748b;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
}

.loading{
  padding:20px;
  text-align:center;
  font-weight:700;
  color:#2563eb;
}

.image-status{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  background:#f8fafc;
  font-size:14px;
  color:#475569;
}

.image-success{
  background:#ecfdf5;
  color:#166534;
}

.image-error{
  background:#fff0f0;
  color:#a40000;
}
</style>
</head>

<body>

<div class="container">

  <!-- MAIN -->
  <div class="card">

    <h1>🎬 Apna Creator AI</h1>

    <p>
      Story तयार करा → 8 Scenes तयार करा → 8 Cartoon Images आपोआप तयार करा.
    </p>

    <label for="story">
      तुमची Story
    </label>

    <textarea
      id="story"
      placeholder="उदा. एक छोटा मुलगा जंगलात जातो आणि त्याला बोलणारा पोपट भेटतो."
    ></textarea>

    <label for="language">
      Language
    </label>

    <select id="language">
      <option value="Hindi">Hindi</option>
      <option value="Marathi" selected>Marathi</option>
      <option value="English">English</option>
    </select>

    <label for="duration">
      Duration
    </label>

    <select id="duration">
      <option>1 Minute</option>
      <option>2 Minutes</option>
      <option>3 Minutes</option>
    </select>

    <label for="style">
      Cartoon Style
    </label>

    <select id="style">
      <option>3D Cartoon</option>
      <option>2D Cartoon</option>
      <option>Kids Cartoon</option>
    </select>

    <button
      id="createBtn"
      class="primary"
      style="margin-top:16px;"
    >
      🎬 CREATE STORY
    </button>

    <div
      id="status"
      class="status"
    >
      Ready.
    </div>

  </div>


  <!-- STORY -->
  <div class="card">

    <h2>📖 Generated Story</h2>

    <pre id="storyOutput">Story येथे दिसेल.</pre>

  </div>


  <!-- SCENES -->
  <div class="card">

    <h2>🎨 Scenes & Images</h2>

    <div id="scenesOutput">

      <p class="small">
        CREATE STORY दाबल्यानंतर 8 scenes आणि images येथे दिसतील.
      </p>

    </div>

  </div>

</div>


<script>

/* =========================================
   BACKEND URL
========================================= */

const BACKEND_URL =
"https://apna-creator-ai.apnacreatorai.workers.dev/";


/* =========================================
   ELEMENTS
========================================= */

const storyInput =
document.getElementById("story");

const languageInput =
document.getElementById("language");

const durationInput =
document.getElementById("duration");

const styleInput =
document.getElementById("style");

const createBtn =
document.getElementById("createBtn");

const statusBox =
document.getElementById("status");

const storyOutput =
document.getElementById("storyOutput");

const scenesOutput =
document.getElementById("scenesOutput");


/* =========================================
   STATUS
========================================= */

function setStatus(text, type="normal"){

  statusBox.textContent = text;

  statusBox.className = "status";

  if(type === "error"){
    statusBox.classList.add("error");
  }

  if(type === "success"){
    statusBox.classList.add("success");
  }

}


/* =========================================
   CLEAN AI STORY
========================================= */

function cleanStoryText(text){

  let result =
    String(text || "").trim();

  result =
    result
      .replace(/```json/gi,"")
      .replace(/```text/gi,"")
      .replace(/```javascript/gi,"")
      .replace(/```/g,"")
      .trim();


  const start =
    result.search(/SCENE\s*1\b/i);

  if(start >= 0){

    result =
      result.substring(start);

  }


  /*
    Keep only until the end of Scene 8 Voice.
  */

  const scene8Start =
    result.search(
      /SCENE\s*8\b/i
    );

  if(scene8Start >= 0){

    const before =
      result.substring(
        0,
        scene8Start
      );

    const scene8 =
      result.substring(
        scene8Start
      );

    /*
      Remove accidental extra AI text.
    */

    const cleanedScene8 =
      scene8
        .replace(
          /\s+(Here is the output[\s\S]*)$/i,
          ""
        )
        .replace(
          /\s+(I will make sure[\s\S]*)$/i,
          ""
        )
        .replace(
          /\s+(Please let me know[\s\S]*)$/i,
          ""
        )
        .trim();

    result =
      before + cleanedScene8;

  }

  return result.trim();
}


/* =========================================
   PARSE SCENES
========================================= */

function parseScenes(text){

  const scenes = [];

  const regex =
    /SCENE\s*([1-8])\s*[\r\n]+Visual\s*:\s*([\s\S]*?)[\r\n]+Voice\s*:\s*([\s\S]*?)(?=[\r\n]+SCENE\s*[1-8]\b|$)/gi;

  let match;

  while(
    (match = regex.exec(text || "")) !== null
  ){

    const number =
      Number(match[1]);

    let visual =
      String(match[2] || "")
        .replace(/\s+/g," ")
        .trim();

    let voice =
      String(match[3] || "")
        .replace(/\s+/g," ")
        .trim();


    voice =
      voice
        .replace(
          /\bSTOP\b.*$/i,
          ""
        )
        .replace(
          /Here is the output.*$/i,
          ""
        )
        .replace(
          /I will make sure.*$/i,
          ""
        )
        .replace(
          /Please let me know.*$/i,
          ""
        )
        .trim();


    if(
      number >= 1 &&
      number <= 8 &&
      visual &&
      voice
    ){

      scenes.push({
        number,
        visual,
        voice
      });

    }

  }


  /*
    Remove duplicate scene numbers.
  */

  const unique = [];

  scenes.forEach(scene => {

    if(
      !unique.some(
        x => x.number === scene.number
      )
    ){

      unique.push(scene);

    }

  });


  unique.sort(
    (a,b) =>
      a.number - b.number
  );


  return unique;
}


/* =========================================
   GENERATE ONE IMAGE
========================================= */

async function generateImage(
  scene,
  imageBox,
  imageStatus
){

  imageStatus.className =
    "image-status";

  imageStatus.textContent =
    "🎨 Scene " +
    scene.number +
    " ची image तयार होत आहे...";


  imageBox.innerHTML =
    '<div class="loading">🎨 Image generating...<br>कृपया थांबा.</div>';


  try{

    const response =
      await fetch(
        BACKEND_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            action:
              "generate-image",

            visual:
              scene.visual,

            language:
              languageInput.value,

            style:
              styleInput.value

          })
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      let message =
        "Image generation failed. HTTP " +
        response.status;

      try{

        const errorData =
          JSON.parse(errorText);

        if(errorData.error){

          message =
            errorData.error;

        }

      }
      catch(e){}

      throw new Error(message);

    }


    const blob =
      await response.blob();


    if(
      !blob.type ||
      !blob.type.startsWith("image/")
    ){

      throw new Error(
        "Backend ने image ऐवजी दुसरा response दिला."
      );

    }


    const imageURL =
      URL.createObjectURL(blob);


    imageBox.innerHTML =
      "";


    const img =
      document.createElement("img");


    img.src =
      imageURL;

    img.alt =
      "Scene " +
      scene.number +
      " Cartoon Image";


    imageBox.appendChild(img);


    imageStatus.className =
      "image-status image-success";

    imageStatus.textContent =
      "✅ Scene " +
      scene.number +
      " image तयार झाली.";


    return true;

  }
  catch(error){

    console.error(
      "Scene " +
      scene.number +
      " image error:",
      error
    );


    imageBox.innerHTML =
      "❌ Image तयार झाली नाही.";


    imageStatus.className =
      "image-status image-error";

    imageStatus.textContent =
      "❌ Scene " +
      scene.number +
      " image error: " +
      (
        error.message ||
        error
      );


    return false;

  }

}


/* =========================================
   GENERATE ALL 8 IMAGES
========================================= */

async function generateAllImages(
  scenes,
  sceneElements
){

  let successCount =
    0;

  let failedCount =
    0;


  /*
    Generate one by one.
    This prevents sending 8 AI requests
    at exactly the same time.
  */

  for(
    let i = 0;
    i < scenes.length;
    i++
  ){

    const scene =
      scenes[i];

    const elements =
      sceneElements[i];


    setStatus(
      "🎨 Images तयार होत आहेत...\n\n" +
      "Scene " +
      scene.number +
      " / 8\n" +
      "आत्तापर्यंत तयार: " +
      successCount
    );


    const success =
      await generateImage(
        scene,
        elements.imageBox,
        elements.imageStatus
      );


    if(success){

      successCount++;

    }
    else{

      failedCount++;

    }

  }


  if(
    failedCount === 0
  ){

    setStatus(
      "🎉 पूर्ण झाले!\n\n" +
      "8 पैकी 8 images तयार झाल्या.",
      "success"
    );

  }
  else{

    setStatus(
      "⚠️ Image generation पूर्ण झाली.\n\n" +
      "तयार: " +
      successCount +
      " / 8\n" +
      "Failed: " +
      failedCount +
      " / 8",
      failedCount < 8
        ? "normal"
        : "error"
    );

  }

}


/* =========================================
   RENDER SCENES
========================================= */

function renderScenes(scenes){

  scenesOutput.innerHTML = "";


  const sceneElements = [];


  scenes.forEach(scene => {

    const div =
      document.createElement("div");

    div.className =
      "scene";


    /* TITLE */

    const h =
      document.createElement("h3");

    h.textContent =
      "🎬 SCENE " +
      scene.number;


    /* VISUAL */

    const visual =
      document.createElement("p");

    const visualBold =
      document.createElement("b");

    visualBold.textContent =
      "Visual: ";

    visual.appendChild(
      visualBold
    );

    visual.appendChild(
      document.createTextNode(
        scene.visual
      )
    );


    /* VOICE */

    const voice =
      document.createElement("p");

    const voiceBold =
      document.createElement("b");

    voiceBold.textContent =
      "Voice: ";

    voice.appendChild(
      voiceBold
    );

    voice.appendChild(
      document.createTextNode(
        scene.voice
      )
    );


    /* IMAGE BOX */

    const imageBox =
      document.createElement("div");

    imageBox.className =
      "image-box";

    imageBox.innerHTML =
      "⏳ Image तयार होण्याची वाट पाहत आहे...";


    /* IMAGE STATUS */

    const imageStatus =
      document.createElement("div");

    imageStatus.className =
      "image-status";

    imageStatus.textContent =
      "⏳ Waiting...";


    /*
      Add elements.
    */

    div.appendChild(h);

    div.appendChild(
      visual
    );

    div.appendChild(
      voice
    );

    div.appendChild(
      imageBox
    );

    div.appendChild(
      imageStatus
    );


    scenesOutput.appendChild(
      div
    );


    sceneElements.push({
      imageBox,
      imageStatus
    });

  });


  return sceneElements;
}


/* =========================================
   CREATE STORY
========================================= */

async function createStory(){

  const story =
    storyInput.value.trim();


  if(!story){

    setStatus(
      "कृपया Story लिहा.",
      "error"
    );

    return;

  }


  createBtn.disabled =
    true;

  createBtn.textContent =
    "⏳ CREATING STORY + IMAGES...";


  setStatus(
    "🤖 AI कहानी तयार करत आहे...\n\n" +
    "पहिले 8 scenes तयार होतील."
  );


  storyOutput.textContent =
    "कृपया थोडा वेळ थांबा...";


  scenesOutput.innerHTML =
    '<div class="loading">🤖 8 scenes तयार होत आहेत...</div>';


  try{

    /* =====================================
       STORY REQUEST
    ===================================== */

    const response =
      await fetch(
        BACKEND_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            story:
              story,

            language:
              languageInput.value,

            duration:
              durationInput.value,

            style:
              styleInput.value

          })
        }
      );


    const raw =
      await response.text();


    let data;

    try{

      data =
        JSON.parse(raw);

    }
    catch(e){

      throw new Error(
        "Backend ने valid JSON दिले नाही."
      );

    }


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Backend HTTP " +
        response.status
      );

    }


    /* =====================================
       STORY CLEAN
    ===================================== */

    const cleanStory =
      cleanStoryText(
        data.story || ""
      );


    storyOutput.textContent =
      cleanStory;


    /* =====================================
       PARSE 8 SCENES
    ===================================== */

    const scenes =
      parseScenes(
        cleanStory
      );


    if(
      scenes.length !== 8
    ){

      throw new Error(
        "Story मिळाली, पण 8 scenes पूर्ण मिळाले नाहीत."
      );

    }


    /* =====================================
       RENDER 8 SCENES
    ===================================== */

    const sceneElements =
      renderScenes(
        scenes
      );


    /* =====================================
       START AUTOMATIC IMAGES
    ===================================== */

    setStatus(
      "✅ 8 scenes तयार झाले!\n\n" +
      "🎨 आता 8 images आपोआप तयार होत आहेत...\n\n" +
      "कृपया browser बंद करू नका."
    );


    await generateAllImages(
      scenes,
      sceneElements
    );

  }
  catch(error){

    console.error(error);


    storyOutput.textContent =
      "Story तयार झाली नाही.";


    scenesOutput.innerHTML =
      '<p class="small">❌ Scenes तयार झाले नाहीत.</p>';


    setStatus(
      "❌ AI से कहानी बनाने में समस्या आई.\n\n" +
      "Error: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }
  finally{

    createBtn.disabled =
      false;

    createBtn.textContent =
      "🎬 CREATE STORY";

  }

}


/* =========================================
   BUTTON
========================================= */

createBtn.addEventListener(
  "click",
  createStory
);

</script>

</body>
</html>
