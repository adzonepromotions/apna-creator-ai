<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apna Creator AI - Free 3D Cartoon Video Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f1f5f9; color: #1e293b; padding: 20px; }
    .container { max-width: 950px; margin: auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #0284c7; margin-bottom: 20px; }
    label { font-weight: bold; margin-top: 10px; display: block; color: #334155; }
    textarea, select { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    button { background: #0284c7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 20px; padding: 14px; background: #e0f2fe; border-left: 5px solid #0284c7; font-weight: bold; border-radius: 4px; white-space: pre-line; color: #0369a1; }
    .video-section { margin-top: 25px; background: #0f172a; padding: 20px; border-radius: 12px; text-align: center; color: white; display: none; }
    video { width: 100%; max-width: 720px; border-radius: 8px; margin-top: 15px; background: #000; }
    .download-btn { background: #16a34a; color: white; padding: 12px 24px; text-decoration: none; display: inline-block; font-weight: bold; border-radius: 6px; margin-top: 15px; }
    .scenes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-top: 25px; }
    .scene-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .scene-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; background: #f8fafc; }
    .scene-card h4 { margin: 10px 0 5px 0; color: #0284c7; }
    .scene-card p { font-size: 13px; line-height: 1.4; margin: 4px 0; }
    .voice-btn { background: #475569; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; margin-top: 8px; width: auto; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎬 Apna Creator AI: 3D Cartoon Video Studio (100% Free)</h1>

  <label>कथा / स्टोरी कल्पना लिहा:</label>
  <textarea id="storyInput" rows="3" placeholder="उदा. एक छोटा मुलगा जंगलात फिरायला जातो आणि त्याला एक बोलणारा पोपट भेटतो..."></textarea>

  <label>भाषा निवडा (Select Language):</label>
  <select id="languageSelect">
    <option value="Marathi">मराठी (Marathi)</option>
    <option value="Hindi">हिंदी (Hindi)</option>
    <option value="English">English</option>
  </select>

  <button id="createBtn" onclick="startGeneration()">🚀 3D कथा, आवाज आणि व्हिडिओ तयार करा</button>

  <div id="status">येथे प्रोसेस दिसेल...</div>

  <!-- तयार झालेला पूर्ण व्हिडिओ -->
  <div id="videoContainer" class="video-section">
    <h2 style="color:#38bdf8;">🎥 तयार झालेला 3D कार्टून व्हिडिओ</h2>
    <video id="finalVideo" controls></video>
    <br>
    <a id="downloadLink" class="download-btn" href="#" download="cartoon_video.webm">⬇️ व्हिडिओ डाउनलोड करा (Download Video)</a>
  </div>

  <div id="scenesContainer" class="scenes-grid"></div>
</div>

<canvas id="renderCanvas" width="1280" height="720" style="display:none;"></canvas>

<script>
  // अचूक Cloudflare Worker URL
  const BACKEND_URL = "https://apna-creator-ai.apnacreatorai.workers.dev";
  let loadedScenes = [];

  function setStatus(text) {
    document.getElementById("status").innerText = text;
  }

  function getVoiceForLanguage(lang) {
    const voices = window.speechSynthesis.getVoices();
    if (lang === "Marathi") {
      return voices.find(v => v.lang.includes("mr") || v.lang.includes("MR")) || voices.find(v => v.lang.includes("hi")) || null;
    } else if (lang === "Hindi") {
      return voices.find(v => v.lang.includes("hi") || v.lang.includes("HI")) || null;
    } else {
      return voices.find(v => v.lang.includes("en-IN") || v.lang.includes("en-US")) || null;
    }
  }

  function playVoice(text, lang) {
    return new Promise((resolve) => {
      if (!('speechSynthesis' in window)) { resolve(); return; }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      
      const voice = getVoiceForLanguage(lang);
      if (voice) utterance.voice = voice;
      utterance.lang = lang === 'Marathi' ? 'mr-IN' : (lang === 'Hindi' ? 'hi-IN' : 'en-US');
      utterance.rate = 0.9;
      utterance.pitch = 1.1;

      utterance.onend = () => resolve();
      utterance.onerror = () => resolve();
      window.speechSynthesis.speak(utterance);
    });
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  async function startGeneration() {
    const story = document.getElementById("storyInput").value.trim();
    const language = document.getElementById("languageSelect").value;
    const btn = document.getElementById("createBtn");
    const container = document.getElementById("scenesContainer");
    const videoCard = document.getElementById("videoContainer");

    if (!story) { alert("कृपया आधी कथा लिहा!"); return; }

    btn.disabled = true;
    container.innerHTML = "";
    videoCard.style.display = "none";
    loadedScenes = [];

    try {
      setStatus("⏳ १/३: AI कथा आणि ८ सीन्स लिहीत आहे...");
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ story, language })
      });

      const data = await res.json();
      if (!data.success) throw new Error(data.error || "कथा तयार करता आली नाही.");

      const sceneMatches = [...data.story.matchAll(/SCENE\s*([1-8])[\r\n]+Visual:\s*([\s\S]*?)[\r\n]+Voice:\s*([\s\S]*?)(?=SCENE\s*[1-8]|$)/gi)];
      const scenes = sceneMatches.map(m => ({ number: m[1], visual: m[2].trim(), voice: m[3].trim() }));

      if (scenes.length === 0) throw new Error("सीन्स फॉरमॅट वाचता आला नाही.");

      setStatus("✅ ८ सीन्स तयार झाले!\n⏳ २/३: आता सर्व ८ इमेजेस जनरेट होत आहेत...");

      for (let i = 0; i < scenes.length; i++) {
        const sc = scenes[i];
        setStatus(`⏳ 3D इमेज ${i + 1}/8 तयार होत आहे...`);

        const imgRes = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "generate-image", visual: sc.visual })
        });

        const blob = await imgRes.blob();
        const imgUrl = URL.createObjectURL(blob);

        const card = document.createElement("div");
        card.className = "scene-card";
        card.innerHTML = `
          <img src="${imgUrl}">
          <h4>🎬 SCENE ${sc.number}</h4>
          <p><strong>Visual:</strong> ${sc.visual}</p>
          <p><strong>Voice:</strong> "${sc.voice}"</p>
          <button class="voice-btn" onclick="playVoice('${sc.voice.replace(/'/g, "\\'")}', '${language}')">🔊 आवाज ऐका</button>
        `;
        container.appendChild(card);

        const imgEl = new Image();
        imgEl.src = imgUrl;
        await new Promise(r => imgEl.onload = r);
        loadedScenes.push({ img: imgEl, voice: sc.voice });
      }

      setStatus("⏳ ३/३: 3D मोशन व्हिडिओ तयार होत आहे, कृपया थोडा वेळ थांबा...");
      await buildMotionVideo(language);

    } catch (err) {
      setStatus("❌ त्रुटी आली: " + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function buildMotionVideo(language) {
    const canvas = document.getElementById("renderCanvas");
    const ctx = canvas.getContext("2d");
    const stream = canvas.captureStream(30);
    const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
    const chunks = [];

    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      document.getElementById("finalVideo").src = url;
      document.getElementById("downloadLink").href = url;
      document.getElementById("videoContainer").style.display = "block";
      setStatus("🎉 अभिनंदन! तुमचा 3D कार्टून व्हिडिओ पूर्णपणे तयार झाला आहे. खाली बघा आणि डाउनलोड करा.");
    };

    mediaRecorder.start();

    for (let i = 0; i < loadedScenes.length; i++) {
      const item = loadedScenes[i];
      playVoice(item.voice, language);

      const duration = 4500;
      const startTime = performance.now();

      await new Promise(resolve => {
        function renderFrame(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          
          const scale = 1.0 + (progress * 0.15);
          const panX = (canvas.width * (scale - 1)) / 2;
          const panY = (canvas.height * (scale - 1)) / 2;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.translate(-panX * progress, -panY * progress);
          ctx.scale(scale, scale);
          ctx.drawImage(item.img, 0, 0, canvas.width, canvas.height);
          ctx.restore();

          ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
          ctx.fillRect(50, canvas.height - 120, canvas.width - 100, 80);
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 28px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(item.voice, canvas.width / 2, canvas.height - 70);

          if (progress < 1) {
            requestAnimationFrame(renderFrame);
          } else {
            resolve();
          }
        }
        requestAnimationFrame(renderFrame);
      });
    }

    mediaRecorder.stop();
  }
</script>
</body>
</html>
