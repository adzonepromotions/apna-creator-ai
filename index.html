<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Creator AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.container{max-width:1000px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{margin-top:0}
label{display:block;font-weight:700;margin:14px 0 7px}
textarea,select,input{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:10px;font-size:15px}
textarea{min-height:150px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:white}
.secondary{background:#e8eef8;color:#172033}
button:disabled{opacity:.6;cursor:not-allowed}
.status{padding:12px;border-radius:10px;background:#eef4ff;margin-top:15px;white-space:pre-wrap}
.error{background:#fff0f0;color:#a40000}
.scene{border:1px solid #dce3ec;border-radius:14px;padding:16px;margin:12px 0}
.scene h3{margin:0 0 12px}
.scene p{line-height:1.5}
.image-box{min-height:120px;background:#f1f4f8;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:10px}
.image-box img{width:100%;display:block}
.small{font-size:13px;color:#64748b}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1;min-width:180px}
pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🎬 Apna Creator AI</h1>
    <p>Story तयार करा आणि 8 scenes तयार करा.</p>

    <label for="story">तुमची Story</label>
    <textarea id="story" placeholder="उदा. एक छोटा मुलगा जंगलात फिरायला जातो..."></textarea>

    <label for="language">Language</label>
    <select id="language">
      <option value="Hindi">Hindi</option>
      <option value="Marathi" selected>Marathi</option>
      <option value="English">English</option>
    </select>

    <label for="duration">Duration</label>
    <select id="duration">
      <option>1 Minute</option>
      <option>2 Minutes</option>
      <option>3 Minutes</option>
    </select>

    <label for="style">Style</label>
    <select id="style">
      <option>3D Cartoon</option>
      <option>2D Cartoon</option>
      <option>Kids Cartoon</option>
    </select>

    <div class="row" style="margin-top:16px">
      <button id="createBtn" class="primary">CREATE STORY</button>
    </div>

    <div id="status" class="status">Ready.</div>
  </div>

  <div class="card">
    <h2>📖 Generated Story</h2>
    <pre id="storyOutput">Story येथे दिसेल.</pre>
  </div>

  <div class="card">
    <h2>🎨 Scenes</h2>
    <div id="scenesOutput">
      <p class="small">Story तयार झाल्यावर 8 scenes येथे दिसतील.</p>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = "https://apna-creator-ai.apnacreatorai.workers.dev/";

const storyInput = document.getElementById("story");
const languageInput = document.getElementById("language");
const durationInput = document.getElementById("duration");
const styleInput = document.getElementById("style");
const createBtn = document.getElementById("createBtn");
const statusBox = document.getElementById("status");
const storyOutput = document.getElementById("storyOutput");
const scenesOutput = document.getElementById("scenesOutput");

function setStatus(text, error=false){
  statusBox.textContent = text;
  statusBox.className = error ? "status error" : "status";
}

function parseScenes(text){
  const scenes = [];
  const regex = /SCENE\s*([1-8])\s*\nVisual:\s*([\s\S]*?)\nVoice:\s*([\s\S]*?)(?=\n\nSCENE\s*[1-8]\b|$)/gi;
  let m;
  while((m = regex.exec(text || "")) !== null){
    scenes.push({
      number:Number(m[1]),
      visual:m[2].trim(),
      voice:m[3].trim()
    });
  }
  return scenes;
}

function renderScenes(scenes){
  scenesOutput.innerHTML = "";

  scenes.forEach(scene=>{
    const div = document.createElement("div");
    div.className = "scene";

    const h = document.createElement("h3");
    h.textContent = "SCENE " + scene.number;

    const visual = document.createElement("p");
    const vb = document.createElement("b");
    vb.textContent = "Visual: ";
    visual.appendChild(vb);
    visual.appendChild(document.createTextNode(scene.visual));

    const voice = document.createElement("p");
    const vob = document.createElement("b");
    vob.textContent = "Voice: ";
    voice.appendChild(vob);
    voice.appendChild(document.createTextNode(scene.voice));

    const imageBox = document.createElement("div");
    imageBox.className = "image-box";
    imageBox.textContent = "🎨 Image generation पुढच्या step मध्ये जोडता येईल.";

    div.appendChild(h);
    div.appendChild(visual);
    div.appendChild(voice);
    div.appendChild(imageBox);
    scenesOutput.appendChild(div);
  });
}

async function createStory(){
  const story = storyInput.value.trim();

  if(!story){
    setStatus("कृपया Story लिहा.", true);
    return;
  }

  createBtn.disabled = true;
  createBtn.textContent = "CREATING...";
  setStatus("AI कहानी तयार करत आहे...");

  try{
    const response = await fetch(BACKEND_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        story:story,
        language:languageInput.value,
        duration:durationInput.value,
        style:styleInput.value
      })
    });

    const raw = await response.text();

    let data;
    try{
      data = JSON.parse(raw);
    }catch(e){
      throw new Error("Backend ने valid JSON दिले नाही: " + raw.slice(0,300));
    }

    if(!response.ok || !data.success){
      throw new Error(data.error || ("Backend HTTP " + response.status));
    }

    // Clean AI output before displaying it.
    let cleanStory = String(data.story || "").trim();

    // Keep only SCENE 1 through SCENE 8 and remove anything after SCENE 8 Voice.
    const scene8Match = cleanStory.match(
      /([\\s\\S]*?SCENE\\s*8\\s*\\nVisual:[\\s\\S]*?\\nVoice:[^\\n]*)/i
    );

    if(scene8Match){
      cleanStory = scene8Match[1].trim();
    }

    // Remove accidental markdown/code fences.
    cleanStory = cleanStory
      .replace(/```(?:text|json)?/gi, "")
      .replace(/```/g, "")
      .trim();

    storyOutput.textContent = cleanStory;

    const scenes = parseScenes(cleanStory);

    if(scenes.length !== 8){
      throw new Error("Story मिळाली, पण 8 scenes पूर्ण मिळाले नाहीत.");
    }

    renderScenes(scenes);
    setStatus("✅ AI ने आपकी कहानी तैयार कर दी! 8 scenes clean झाले.");

  }catch(error){
    console.error(error);
    setStatus("❌ AI से कहानी बनाने में समस्या आई.\nError: " + (error.message || error), true);
  }finally{
    createBtn.disabled = false;
    createBtn.textContent = "CREATE STORY";
  }
}

createBtn.addEventListener("click", createStory);
</script>
</body>
</html>
