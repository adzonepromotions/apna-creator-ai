<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apna Creator AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.container{
  max-width:1000px;
  margin:0 auto;
  padding:24px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
}

textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccd4df;
  border-radius:10px;
  font-size:15px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#2563eb;
  color:white;
  width:100%;
}

.image-button{
  background:#16a34a;
  color:white;
  width:100%;
  margin-top:12px;
}

.status{
  padding:12px;
  border-radius:10px;
  background:#eef4ff;
  margin-top:15px;
  white-space:pre-wrap;
}

.error{
  background:#fff0f0;
  color:#a40000;
}

.success{
  background:#ecfdf5;
  color:#166534;
}

.scene{
  border:1px solid #dce3ec;
  border-radius:14px;
  padding:16px;
  margin:14px 0;
  background:#fff;
}

.scene h3{
  margin:0 0 12px;
}

.scene p{
  line-height:1.5;
}

.image-box{
  min-height:200px;
  background:#f1f4f8;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-top:12px;
  color:#64748b;
  text-align:center;
  padding:10px;
}

.image-box img{
  width:100%;
  height:auto;
  display:block;
  border-radius:10px;
}

.small{
  font-size:13px;
  color:#64748b;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
}

.loading{
  padding:20px;
  text-align:center;
  font-weight:700;
  color:#2563eb;
}
</style>
</head>

<body>

<div class="container">

  <!-- MAIN -->
  <div class="card">

    <h1>🎬 Apna Creator AI</h1>

    <p>
      Story तयार करा → 8 Scenes तयार करा → Cartoon Images तयार करा.
    </p>

    <label for="story">
      तुमची Story
    </label>

    <textarea
      id="story"
      placeholder="उदा. एक छोटा मुलगा जंगलात जातो आणि त्याला बोलणारा पोपट भेटतो."
    ></textarea>

    <label for="language">
      Language
    </label>

    <select id="language">
      <option value="Hindi">Hindi</option>
      <option value="Marathi" selected>Marathi</option>
      <option value="English">English</option>
    </select>

    <label for="duration">
      Duration
    </label>

    <select id="duration">
      <option>1 Minute</option>
      <option>2 Minutes</option>
      <option>3 Minutes</option>
    </select>

    <label for="style">
      Cartoon Style
    </label>

    <select id="style">
      <option>3D Cartoon</option>
      <option>2D Cartoon</option>
      <option>Kids Cartoon</option>
    </select>

    <button
      id="createBtn"
      class="primary"
      style="margin-top:16px;"
    >
      🎬 CREATE STORY
    </button>

    <div
      id="status"
      class="status"
    >
      Ready.
    </div>

  </div>


  <!-- STORY -->
  <div class="card">

    <h2>📖 Generated Story</h2>

    <pre id="storyOutput">Story येथे दिसेल.</pre>

  </div>


  <!-- SCENES -->
  <div class="card">

    <h2>🎨 Scenes & Images</h2>

    <div id="scenesOutput">

      <p class="small">
        Story तयार झाल्यावर 8 scenes येथे दिसतील.
      </p>

    </div>

  </div>

</div>


<script>

/* =========================================
   BACKEND URL
========================================= */

const BACKEND_URL =
"https://apna-creator-ai.apnacreatorai.workers.dev/";


/* =========================================
   ELEMENTS
========================================= */

const storyInput =
document.getElementById("story");

const languageInput =
document.getElementById("language");

const durationInput =
document.getElementById("duration");

const styleInput =
document.getElementById("style");

const createBtn =
document.getElementById("createBtn");

const statusBox =
document.getElementById("status");

const storyOutput =
document.getElementById("storyOutput");

const scenesOutput =
document.getElementById("scenesOutput");


/* =========================================
   STATUS
========================================= */

function setStatus(text, type="normal"){

  statusBox.textContent = text;

  statusBox.className = "status";

  if(type === "error"){
    statusBox.classList.add("error");
  }

  if(type === "success"){
    statusBox.classList.add("success");
  }

}


/* =========================================
   CLEAN AI STORY
========================================= */

function cleanStoryText(text){

  let result =
    String(text || "").trim();

  result =
    result
      .replace(/```json/gi,"")
      .replace(/```text/gi,"")
      .replace(/```/g,"")
      .trim();

  /*
    Keep only from SCENE 1.
  */

  const start =
    result.search(/SCENE\s*1\b/i);

  if(start >= 0){

    result =
      result.substring(start);

  }


  /*
    Remove unwanted text after Scene 8 Voice.
  */

  const scene8 =
    result.match(
      /([\s\S]*?SCENE\s*8\s*[\r\n]+Visual\s*:[\s\S]*?[\r\n]+Voice\s*:[\s\S]*)/i
    );

  if(scene8){

    result =
      scene8[1];

  }


  /*
    Remove repeated garbage after a clear
    ending sentence.
  */

  result =
    result
      .replace(
        /\s+(I will make sure[\s\S]*)$/i,
        ""
      )
      .replace(
        /\s+(Here is the output[\s\S]*)$/i,
        ""
      )
      .replace(
        /\s+(Please let me know[\s\S]*)$/i,
        ""
      )
      .trim();

  return result;
}


/* =========================================
   PARSE SCENES
========================================= */

function parseScenes(text){

  const scenes = [];

  const regex =
    /SCENE\s*([1-8])\s*[\r\n]+Visual\s*:\s*([\s\S]*?)[\r\n]+Voice\s*:\s*([\s\S]*?)(?=[\r\n]+SCENE\s*[1-8]\b|$)/gi;

  let match;

  while(
    (match = regex.exec(text || "")) !== null
  ){

    const number =
      Number(match[1]);

    let visual =
      String(match[2] || "")
        .replace(/\s+/g," ")
        .trim();

    let voice =
      String(match[3] || "")
        .replace(/\s+/g," ")
        .trim();

    /*
      Remove accidental extra instructions.
    */

    voice =
      voice
        .replace(
          /\bSTOP\b.*$/i,
          ""
        )
        .replace(
          /Here is the output.*$/i,
          ""
        )
        .replace(
          /I will make sure.*$/i,
          ""
        )
        .trim();

    if(
      number >= 1 &&
      number <= 8 &&
      visual &&
      voice
    ){

      scenes.push({
        number,
        visual,
        voice
      });

    }

  }

  /*
    Remove duplicate scenes.
  */

  const unique = [];

  scenes.forEach(scene => {

    if(
      !unique.some(
        x => x.number === scene.number
      )
    ){

      unique.push(scene);

    }

  });


  unique.sort(
    (a,b) =>
      a.number - b.number
  );


  return unique;
}


/* =========================================
   GENERATE IMAGE
========================================= */

async function generateImage(
  scene,
  imageBox,
  imageButton
){

  imageButton.disabled = true;

  imageButton.textContent =
    "⏳ IMAGE GENERATING...";

  imageBox.innerHTML =
    '<div class="loading">🎨 Image तयार होत आहे...<br>कृपया थोडा वेळ थांबा.</div>';

  setStatus(
    "🎨 Scene " +
    scene.number +
    " ची image तयार होत आहे..."
  );

  try{

    const response =
      await fetch(
        BACKEND_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            action:
              "generate-image",

            visual:
              scene.visual,

            language:
              languageInput.value,

            style:
              styleInput.value

          })
        }
      );


    /*
      Read response.
    */

    if(!response.ok){

      const errorText =
        await response.text();

      let message =
        "Image generation failed. HTTP " +
        response.status;

      try{

        const errorData =
          JSON.parse(errorText);

        if(errorData.error){

          message =
            errorData.error;

        }

      }catch(e){}

      throw new Error(message);
    }


    /*
      Convert response to image.
    */

    const blob =
      await response.blob();


    if(
      !blob.type ||
      !blob.type.startsWith("image/")
    ){

      throw new Error(
        "Backend ने image ऐवजी दुसरा response दिला."
      );

    }


    const imageURL =
      URL.createObjectURL(blob);


    imageBox.innerHTML = "";


    const img =
      document.createElement("img");


    img.src =
      imageURL;

    img.alt =
      "Scene " +
      scene.number +
      " Cartoon Image";


    imageBox.appendChild(img);


    imageButton.textContent =
      "✅ IMAGE GENERATED";

    imageButton.disabled =
      true;


    setStatus(
      "✅ Scene " +
      scene.number +
      " ची image तयार झाली!",
      "success"
    );

  }
  catch(error){

    console.error(error);

    imageButton.disabled =
      false;

    imageButton.textContent =
      "🎨 GENERATE IMAGE";

    imageBox.innerHTML =
      "❌ Image तयार झाली नाही.";

    setStatus(
      "❌ Scene " +
      scene.number +
      " image error:\n" +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/* =========================================
   RENDER SCENES
========================================= */

function renderScenes(scenes){

  scenesOutput.innerHTML = "";


  scenes.forEach(scene => {

    const div =
      document.createElement("div");

    div.className =
      "scene";


    /* TITLE */

    const h =
      document.createElement("h3");

    h.textContent =
      "🎬 SCENE " +
      scene.number;


    /* VISUAL */

    const visual =
      document.createElement("p");

    const visualBold =
      document.createElement("b");

    visualBold.textContent =
      "Visual: ";

    visual.appendChild(
      visualBold
    );

    visual.appendChild(
      document.createTextNode(
        scene.visual
      )
    );


    /* VOICE */

    const voice =
      document.createElement("p");

    const voiceBold =
      document.createElement("b");

    voiceBold.textContent =
      "Voice: ";

    voice.appendChild(
      voiceBold
    );

    voice.appendChild(
      document.createTextNode(
        scene.voice
      )
    );


    /* IMAGE BOX */

    const imageBox =
      document.createElement("div");

    imageBox.className =
      "image-box";

    imageBox.textContent =
      "🖼️ Image येथे दिसेल";


    /* IMAGE BUTTON */

    const imageButton =
      document.createElement("button");

    imageButton.className =
      "image-button";

    imageButton.textContent =
      "🎨 GENERATE IMAGE";


    imageButton.addEventListener(
      "click",
      () => {

        generateImage(
          scene,
          imageBox,
          imageButton
        );

      }
    );


    /*
      Add elements.
    */

    div.appendChild(h);

    div.appendChild(
      visual
    );

    div.appendChild(
      voice
    );

    div.appendChild(
      imageButton
    );

    div.appendChild(
      imageBox
    );


    scenesOutput.appendChild(
      div
    );

  });

}


/* =========================================
   CREATE STORY
========================================= */

async function createStory(){

  const story =
    storyInput.value.trim();


  if(!story){

    setStatus(
      "कृपया Story लिहा.",
      "error"
    );

    return;
  }


  createBtn.disabled =
    true;

  createBtn.textContent =
    "⏳ CREATING STORY...";


  setStatus(
    "🤖 AI कहानी तयार करत आहे..."
  );


  storyOutput.textContent =
    "कृपया थोडा वेळ थांबा...";


  scenesOutput.innerHTML =
    '<div class="loading">🤖 8 scenes तयार होत आहेत...</div>';


  try{

    const response =
      await fetch(
        BACKEND_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            story:
              story,

            language:
              languageInput.value,

            duration:
              durationInput.value,

            style:
              styleInput.value

          })
        }
      );


    const raw =
      await response.text();


    let data;

    try{

      data =
        JSON.parse(raw);

    }
    catch(e){

      throw new Error(
        "Backend ने valid JSON दिले नाही."
      );

    }


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Backend HTTP " +
        response.status
      );

    }


    /*
      Clean story.
    */

    const cleanStory =
      cleanStoryText(
        data.story || ""
      );


    storyOutput.textContent =
      cleanStory;


    /*
      Parse scenes.
    */

    const scenes =
      parseScenes(
        cleanStory
      );


    if(
      scenes.length !== 8
    ){

      throw new Error(
        "Story मिळाली, पण 8 scenes पूर्ण मिळाले नाहीत."
      );

    }


    /*
      Render scenes.
    */

    renderScenes(
      scenes
    );


    setStatus(
      "✅ AI ने कहानी तयार केली!\n\n" +
      "8 scenes तयार आहेत.\n" +
      "आता प्रत्येक Scene खाली 🎨 GENERATE IMAGE दाब.",
      "success"
    );

  }
  catch(error){

    console.error(error);


    storyOutput.textContent =
      "Story तयार झाली नाही.";


    scenesOutput.innerHTML =
      '<p class="small">❌ Scenes तयार झाले नाहीत.</p>';


    setStatus(
      "❌ AI से कहानी बनाने में समस्या आई.\n\n" +
      "Error: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }
  finally{

    createBtn.disabled =
      false;

    createBtn.textContent =
      "🎬 CREATE STORY";

  }

}


/* =========================================
   BUTTON
========================================= */

createBtn.addEventListener(
  "click",
  createStory
);

</script>

</body>
</html>
