<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apna Creator AI - 3D Cartoon Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #0b1120; color: #f8fafc; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    label { font-weight: bold; margin-top: 10px; display: block; color: #94a3b8; }
    textarea, select { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 8px; font-size: 15px; background: #0f172a; color: #fff; }
    button { background: #0284c7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status { margin-top: 20px; padding: 14px; background: #0369a1; border-left: 5px solid #38bdf8; font-weight: bold; border-radius: 4px; white-space: pre-line; color: #ffffff; }
    .video-section { margin-top: 25px; background: #020617; padding: 20px; border-radius: 12px; text-align: center; color: white; display: none; border: 1px solid #38bdf8; }
    video { width: 100%; max-width: 720px; border-radius: 8px; margin-top: 15px; background: #000; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.25); }
    .download-btn { background: #16a34a; color: white; padding: 12px 24px; text-decoration: none; display: inline-block; font-weight: bold; border-radius: 6px; margin-top: 15px; font-size: 16px; }
    .scenes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-top: 25px; }
    .scene-card { background: #334155; border: 1px solid #475569; border-radius: 8px; padding: 12px; }
    .scene-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; background: #0f172a; }
    .scene-card h4 { margin: 10px 0 5px 0; color: #38bdf8; }
    .scene-card p { font-size: 13px; line-height: 1.4; margin: 4px 0; color: #e2e8f0; }
    .voice-btn { background: #0284c7; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎬 Apna Creator AI: 3D Talking Cartoon Studio</h1>

  <label>Enter Story Idea (कहानी का विचार लिखें):</label>
  <textarea id="storyInput" rows="3" placeholder="उदा. एक शेर और एक नन्हा चूहा जंगल में पक्के दोस्त बन जाते हैं..."></textarea>

  <label>Select Language (भाषा चुनें):</label>
  <select id="languageSelect">
    <option value="Hindi">हिंदी (Hindi)</option>
    <option value="English">English</option>
  </select>

  <button id="createBtn" onclick="startGeneration()">🚀 Generate 3D Talking Cartoon Video</button>

  <div id="status">Status will be displayed here...</div>

  <div id="videoContainer" class="video-section">
    <h2 style="color:#38bdf8;">🎥 Generated 3D Video (With Voice)</h2>
    <video id="finalVideo" controls></video>
    <br>
    <a id="downloadLink" class="download-btn" href="#" download="cartoon_story.webm">⬇️ Download Video</a>
  </div>

  <div id="scenesContainer" class="scenes-grid"></div>
</div>

<canvas id="renderCanvas" width="1280" height="720" style="display:none;"></canvas>

<script>
  let loadedScenes = [];

  function setStatus(text) {
    document.getElementById("status").innerText = text;
  }

  function getVoice(lang) {
    const voices = window.speechSynthesis.getVoices();
    if (lang === "Hindi") return voices.find(v => v.lang.includes("hi") || v.lang.includes("HI")) || null;
    return voices.find(v => v.lang.includes("en-IN") || v.lang.includes("en-US") || v.lang.includes("en-GB")) || null;
  }

  function playVoice(text, lang) {
    return new Promise((resolve) => {
      if (!('speechSynthesis' in window)) { resolve(); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = getVoice(lang);
      if (v) u.voice = v;
      u.lang = lang === 'Hindi' ? 'hi-IN' : 'en-US';
      u.rate = 0.9;
      u.pitch = 1.1;
      u.onend = () => resolve();
      u.onerror = () => resolve();
      window.speechSynthesis.speak(u);
    });
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // Automatic Scene Generator (Zero-Server Reliance)
  function createScript(story, language) {
    const isHindi = language === "Hindi";
    const cleanStory = story.replace(/[^\w\s\u0900-\u097F]/gi, '').trim();

    return [
      {
        number: 1,
        visual: `solo 3d cute disney pixar character, ${cleanStory}, beginning exciting adventure in bright sunny green jungle, vibrant lighting, 8k render, octane 3d`,
        voice: isHindi ? "आज एक बहुत सुंदर दिन की शुरुआत हुई है!" : "Today begins a very wonderful new adventure!"
      },
      {
        number: 2,
        visual: `solo 3d cute pixar character, ${cleanStory}, happily walking along green forest pathway surrounded by glowing flowers, cinematic nature`,
        voice: isHindi ? "यह रास्ता कितना शांत और खूबसूरत दिख रहा है!" : "This forest pathway looks so peaceful and calm!"
      },
      {
        number: 3,
        visual: `solo 3d pixar style characters, ${cleanStory}, discovering ripe sweet fruits hanging on a big magical tree, vibrant colors`,
        voice: isHindi ? "अरे वाह! यहाँ कितने स्वादिष्ट और मीठे फल हैं!" : "Wow, look at all these delicious sweet fruits!"
      },
      {
        number: 4,
        visual: `solo 3d cute characters, ${cleanStory}, happily sharing and enjoying sweet fruits together, expressive smiling faces, pixar animation`,
        voice: isHindi ? "यह फल सच में बहुत स्वादिष्ट और ताज़े हैं!" : "These fruits are truly fresh and delicious!"
      },
      {
        number: 5,
        visual: `cute 3d cartoon characters, ${cleanStory}, walking beside a sparkling crystal clear blue river, beautiful scenic reflections`,
        voice: isHindi ? "नदी का पानी कितना साफ और ठंडा है!" : "The river water is so pure and clean!"
      },
      {
        number: 6,
        visual: `cute 3d disney characters, ${cleanStory}, celebrating friendship joyfully near a magical waterfall, cinematic lighting, 8k octane`,
        voice: isHindi ? "हम दोनों अब बहुत अच्छे पक्के दोस्त बन गए हैं!" : "We have become really great best friends now!"
      },
      {
        number: 7,
        visual: `cute 3d pixar characters, ${cleanStory}, resting peacefully under a large shady green banyan tree, serene afternoon glow`,
        voice: isHindi ? "यहाँ ठंडी छाँव में बहुत आराम मिल रहा है!" : "It feels so relaxing here under the cool shade!"
      },
      {
        number: 8,
        visual: `cute 3d disney character, ${cleanStory}, waving goodbye happily under a stunning golden sunset sky, masterpiece 8k 3d render`,
        voice: isHindi ? "आज बहुत मज़ा आया, कल फिर मिलेंगे दोस्त!" : "We had so much fun today, see you again tomorrow!"
      }
    ];
  }

  // Direct Direct AI Image Fetcher
  async function fetchDirectImage(prompt) {
    const encoded = encodeURIComponent(prompt);
    const seed = Math.floor(Math.random() * 999999);
    const imageUrl = `https://image.pollinations.ai/prompt/${encoded}?width=1280&height=720&nologo=true&seed=${seed}&model=flux`;

    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = () => {
        // Backup Image Fallback
        const fallback = new Image();
        fallback.crossOrigin = "anonymous";
        fallback.onload = () => resolve(fallback);
        fallback.src = `https://picsum.photos/1280/720?random=${seed}`;
      };
      img.src = imageUrl;
    });
  }

  async function startGeneration() {
    const story = document.getElementById("storyInput").value.trim();
    const language = document.getElementById("languageSelect").value;
    const btn = document.getElementById("createBtn");
    const container = document.getElementById("scenesContainer");
    const videoCard = document.getElementById("videoContainer");

    if (!story) { alert("Please enter a story idea!"); return; }

    btn.disabled = true;
    container.innerHTML = "";
    videoCard.style.display = "none";
    loadedScenes = [];

    try {
      setStatus("⏳ 1/3: Creating Scenes & Script...");
      const scenes = createScript(story, language);

      setStatus(`✅ ${scenes.length} Scenes Ready!\n⏳ 2/3: Generating 3D Pixar Images (HD)...`);

      for (let i = 0; i < scenes.length; i++) {
        const sc = scenes[i];
        setStatus(`⏳ Generating 3D Image ${i + 1}/${scenes.length}...`);

        const imgEl = await fetchDirectImage(sc.visual);

        const card = document.createElement("div");
        card.className = "scene-card";
        card.innerHTML = `
          <img src="${imgEl.src}">
          <h4>🎬 SCENE ${sc.number}</h4>
          <p><strong>Visual:</strong> ${sc.visual.slice(0, 100)}...</p>
          <p><strong>Voice:</strong> "${sc.voice}"</p>
          <button class="voice-btn" onclick="playVoice('${sc.voice.replace(/'/g, "\\'")}', '${language}')">🔊 Play Voice</button>
        `;
        container.appendChild(card);

        loadedScenes.push({ img: imgEl, voice: sc.voice });
      }

      setStatus("⏳ 3/3: Rendering Final Video with Animation & Voice...");
      await renderTalkingVideo(language);

    } catch (err) {
      setStatus("❌ Error: " + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function renderTalkingVideo(language) {
    const canvas = document.getElementById("renderCanvas");
    const ctx = canvas.getContext("2d");
    const stream = canvas.captureStream(30);
    const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
    const chunks = [];

    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const v = document.getElementById("finalVideo");
      v.src = url;
      v.onplay = () => playFullStory(language);
      document.getElementById("downloadLink").href = url;
      document.getElementById("videoContainer").style.display = "block";
      setStatus("🎉 Success! Your 3D cartoon video is ready!");
    };

    mediaRecorder.start();

    for (let i = 0; i < loadedScenes.length; i++) {
      const item = loadedScenes[i];
      playVoice(item.voice, language);

      const duration = 4500;
      const startTime = performance.now();

      await new Promise(resolve => {
        function loop(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);

          const breath = Math.sin(elapsed / 250) * 4;
          const zoom = 1.0 + (progress * 0.08);

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2 + breath);
          ctx.scale(zoom, zoom);
          ctx.drawImage(item.img, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
          ctx.restore();

          // Subtitle Bar
          ctx.fillStyle = "rgba(11, 17, 32, 0.85)";
          ctx.fillRect(50, canvas.height - 110, canvas.width - 100, 75);
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 2;
          ctx.strokeRect(50, canvas.height - 110, canvas.width - 100, 75);

          ctx.fillStyle = "#38bdf8";
          ctx.font = "bold 20px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(`SCENE ${i + 1}`, canvas.width / 2, canvas.height - 80);

          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 22px sans-serif";
          ctx.fillText(item.voice, canvas.width / 2, canvas.height - 50);

          if (progress < 1) requestAnimationFrame(loop);
          else resolve();
        }
        requestAnimationFrame(loop);
      });
    }

    mediaRecorder.stop();
  }

  async function playFullStory(language) {
    for (let i = 0; i < loadedScenes.length; i++) {
      await playVoice(loadedScenes[i].voice, language);
    }
  }
</script>
</body>
</html>
