<body>

<div class="container">

  <div class="card">

    <h1>🎬 Apna Creator AI</h1>

    <p>
      तुमची Story द्या → 8 Scenes तयार करा → 8 Cartoon Images + Voice आपोआप तयार करा.
    </p>

    <label for="story">तुमची Story</label>

    <textarea
      id="story"
      placeholder="उदा. एक छोटा मुलगा जंगलात जातो आणि त्याला बोलणारा पोपट भेटतो."
    ></textarea>

    <label for="language">Language</label>

    <select id="language">
      <option value="Hindi">Hindi</option>
      <option value="Marathi" selected>Marathi</option>
      <option value="English">English</option>
    </select>

    <label for="duration">Duration</label>

    <select id="duration">
      <option value="1 Minute">1 Minute</option>
      <option value="2 Minutes">2 Minutes</option>
      <option value="3 Minutes">3 Minutes</option>
    </select>

    <label for="style">Cartoon Style</label>

    <select id="style">
      <option value="3D Cartoon">3D Cartoon</option>
      <option value="2D Cartoon">2D Cartoon</option>
      <option value="Kids Cartoon">Kids Cartoon</option>
    </select>

    <button
      id="createBtn"
      class="primary"
      type="button"
    >
      🎬 CREATE STORY
    </button>

    <div id="status" class="status">
      Ready.
    </div>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

  </div>


  <div class="card">

    <h2>📖 Generated Story</h2>

    <pre id="storyOutput">Story येथे दिसेल.</pre>

  </div>


  <div class="card">

    <h2>🎨 Scenes + Images + Voice</h2>

    <div id="scenesOutput">
      <p class="small">
        CREATE STORY दाबल्यानंतर 8 scenes येथे दिसतील.
      </p>
    </div>

  </div>

</div>


<script>

/* =====================================================
   BACKEND
===================================================== */

const BACKEND_URL =
  "https://apna-creator-ai.apnacreatorai.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const storyInput =
  document.getElementById("story");

const languageInput =
  document.getElementById("language");

const durationInput =
  document.getElementById("duration");

const styleInput =
  document.getElementById("style");

const createBtn =
  document.getElementById("createBtn");

const statusBox =
  document.getElementById("status");

const storyOutput =
  document.getElementById("storyOutput");

const scenesOutput =
  document.getElementById("scenesOutput");

const progressBar =
  document.getElementById("progressBar");


/* =====================================================
   STATUS
===================================================== */

function setStatus(text, type) {

  statusBox.textContent = text;
  statusBox.className = "status";

  if (type === "success") {
    statusBox.classList.add("success");
  }

  if (type === "error") {
    statusBox.classList.add("error");
  }
}


/* =====================================================
   PROGRESS
===================================================== */

function setProgress(done, total) {

  if (!total) {
    progressBar.style.width = "0%";
    return;
  }

  const percent =
    Math.round((done / total) * 100);

  progressBar.style.width =
    percent + "%";
}


/* =====================================================
   EXTRACT STORY
===================================================== */

function extractStory(data) {

  if (!data) {
    return "";
  }

  if (typeof data === "string") {
    return data.trim();
  }

  const fields = [
    data.story,
    data.text,
    data.output,
    data.response,
    data.result,
    data.content
  ];

  for (const value of fields) {

    if (
      typeof value === "string" &&
      value.trim()
    ) {
      return value.trim();
    }
  }

  if (
    data.response &&
    typeof data.response === "object"
  ) {

    const nested =
      extractStory(data.response);

    if (nested) {
      return nested;
    }
  }

  if (Array.isArray(data)) {

    for (const item of data) {

      const nested =
        extractStory(item);

      if (nested) {
        return nested;
      }
    }
  }

  return "";
}


/* =====================================================
   CLEAN STORY
===================================================== */

function cleanStoryText(text) {

  let result =
    String(text || "").trim();

  result =
    result
      .replace(/```json/gi, "")
      .replace(/```text/gi, "")
      .replace(/```markdown/gi, "")
      .replace(/```/g, "")
      .trim();

  const index =
    result.search(/SCENE\s*1\b/i);

  if (index >= 0) {
    result =
      result.substring(index).trim();
  }

  result =
    result.replace(
      /\n+\s*(Here is the output|I will make sure|Please let me know|Hope this helps|STOP)[\s\S]*$/i,
      ""
    );

  return result.trim();
}


/* =====================================================
   PARSE SCENES
===================================================== */

function parseScenes(text) {

  const source =
    String(text || "")
      .replace(/\r/g, "")
      .trim();

  const scenes = [];

  const regex =
    /(?:^|\n)\s*SCENE\s*([1-8])\s*:?\s*\n\s*Visual\s*:\s*([\s\S]*?)\n\s*Voice\s*:\s*([\s\S]*?)(?=\n\s*SCENE\s*[1-8]\s*:?\s*\n|$)/gi;

  let match;

  while (
    (match = regex.exec(source)) !== null
  ) {

    const number =
      Number(match[1]);

    const visual =
      String(match[2] || "")
        .replace(/\*\*/g, "")
        .replace(/```/g, "")
        .replace(/\s+/g, " ")
        .trim();

    const voice =
      String(match[3] || "")
        .replace(/\*\*/g, "")
        .replace(/```/g, "")
        .replace(/\s+/g, " ")
        .trim();

    if (
      number >= 1 &&
      number <= 8 &&
      visual &&
      voice
    ) {

      scenes.push({
        number: number,
        visual: visual,
        voice: voice
      });

    }
  }


  const unique =
    new Map();

  for (const scene of scenes) {
    unique.set(scene.number, scene);
  }

  return Array.from(unique.values())
    .sort(function(a, b) {
      return a.number - b.number;
    });
}


/* =====================================================
   RENDER SCENES
===================================================== */

function renderScenes(scenes) {

  scenesOutput.innerHTML = "";

  const elements = [];

  for (const scene of scenes) {

    const div =
      document.createElement("div");

    div.className = "scene";


    const title =
      document.createElement("h3");

    title.textContent =
      "🎬 SCENE " + scene.number;


    const visual =
      document.createElement("p");

    visual.innerHTML =
      "<b>Visual:</b> ";

    visual.appendChild(
      document.createTextNode(scene.visual)
    );


    const voice =
      document.createElement("p");

    voice.innerHTML =
      "<b>Voice:</b> ";

    voice.appendChild(
      document.createTextNode(scene.voice)
    );


    const imageBox =
      document.createElement("div");

    imageBox.className =
      "image-box";

    imageBox.textContent =
      "⏳ Image तयार होत आहे...";


    const imageStatus =
      document.createElement("div");

    imageStatus.className =
      "image-status";

    imageStatus.textContent =
      "Waiting...";


    const voiceTitle =
      document.createElement("div");

    voiceTitle.style.marginTop =
      "16px";

    voiceTitle.innerHTML =
      "<b>🔊 VOICE</b>";


    const voiceStatus =
      document.createElement("div");

    voiceStatus.className =
      "voice-status";

    voiceStatus.textContent =
      "⏳ Voice तयार होत आहे...";


    const controls =
      document.createElement("div");

    controls.className =
      "voice-controls";


    const playBtn =
      document.createElement("button");

    playBtn.type = "button";
    playBtn.className = "play-btn";
    playBtn.textContent = "▶️ Play Voice";
    playBtn.disabled = true;


    const stopBtn =
      document.createElement("button");

    stopBtn.type = "button";
    stopBtn.className = "stop-btn";
    stopBtn.textContent = "⏹️ Stop";
    stopBtn.disabled = true;


    const downloadBtn =
      document.createElement("a");

    downloadBtn.className =
      "download-btn";

    downloadBtn.textContent =
      "⬇️ Download MP3";

    downloadBtn.style.display =
      "none";

    downloadBtn.download =
      "scene-" +
      scene.number +
      ".mp3";


    const audio =
      document.createElement("audio");

    audio.controls = true;
    audio.style.display = "none";


    controls.appendChild(playBtn);
    controls.appendChild(stopBtn);
    controls.appendChild(downloadBtn);


    div.appendChild(title);
    div.appendChild(visual);
    div.appendChild(voice);
    div.appendChild(imageBox);
    div.appendChild(imageStatus);
    div.appendChild(voiceTitle);
    div.appendChild(voiceStatus);
    div.appendChild(controls);
    div.appendChild(audio);

    scenesOutput.appendChild(div);


    elements.push({
      imageBox: imageBox,
      imageStatus: imageStatus,
      voiceStatus: voiceStatus,
      playBtn: playBtn,
      stopBtn: stopBtn,
      downloadBtn: downloadBtn,
      audio: audio,
      audioURL: null
    });

  }

  return elements;
}


/* =====================================================
   GENERATE IMAGE
===================================================== */

async function generateImage(scene, element) {

  element.imageStatus.className =
    "image-status";

  element.imageStatus.textContent =
    "🎨 Scene " +
    scene.number +
    " image तयार होत आहे...";

  element.imageBox.innerHTML =
    '<div class="loading">🎨 Image generating...<br>कृपया थांबा.</div>';

  try {

    const response =
      await fetch(
        BACKEND_URL,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "generate-image",
            visual: scene.visual,
            language: languageInput.value,
            style: styleInput.value
          })
        }
      );

    if (!response.ok) {

      const text =
        await response.text();

      let message =
        "Image error HTTP " +
        response.status;

      try {

        const data =
          JSON.parse(text);

        if (data.error) {
          message = data.error;
        }

      } catch (e) {}

      throw new Error(message);
    }


    const contentType =
      response.headers.get("content-type") || "";

    if (!contentType.includes("image")) {

      const text =
        await response.text();

      throw new Error(
        "Backend ने image ऐवजी response दिला: " +
        text.substring(0, 300)
      );
    }


    const blob =
      await response.blob();

    const url =
      URL.createObjectURL(blob);

    element.imageBox.innerHTML =
      "";

    const img =
      document.createElement("img");

    img.src = url;

    img.alt =
      "Scene " +
      scene.number +
      " Cartoon Image";

    element.imageBox.appendChild(img);

    element.imageStatus.className =
      "image-status ok";

    element.imageStatus.textContent =
      "✅ Scene " +
      scene.number +
      " image तयार झाली.";

    return true;

  } catch (error) {

    console.error(
      "IMAGE ERROR:",
      error
    );

    element.imageBox.textContent =
      "❌ Image तयार झाली नाही.";

    element.imageStatus.className =
      "image-status bad";

    element.imageStatus.textContent =
      "❌ " +
      (error.message || error);

    return false;
  }
}


/* =====================================================
   GENERATE VOICE
===================================================== */

async function generateVoice(scene, element) {

  element.voiceStatus.className =
    "voice-status";

  element.voiceStatus.textContent =
    "🔊 Scene " +
    scene.number +
    " voice तयार होत आहे...";

  element.playBtn.disabled = true;
  element.stopBtn.disabled = true;
  element.downloadBtn.style.display = "none";


  try {

    const response =
      await fetch(
        BACKEND_URL,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "generate-voice",
            text: scene.voice,
            language: languageInput.value
          })
        }
      );


    if (!response.ok) {

      const text =
        await response.text();

      let message =
        "Voice error HTTP " +
        response.status;

      try {

        const data =
          JSON.parse(text);

        if (data.error) {
          message = data.error;
        }

      } catch (e) {}

      throw new Error(message);
    }


    const contentType =
      response.headers.get("content-type") || "";


    if (
      !contentType.includes("audio") &&
      !contentType.includes("mpeg") &&
      !contentType.includes("mp3")
    ) {

      const text =
        await response.text();

      throw new Error(
        "Backend ने audio ऐवजी response दिला: " +
        text.substring(0, 300)
      );
    }


    const blob =
      await response.blob();


    if (!blob.size) {
      throw new Error(
        "Audio file रिकामी आहे."
      );
    }


    const url =
      URL.createObjectURL(blob);


    element.audioURL =
      url;

    element.audio.src =
      url;


    element.playBtn.disabled =
      false;

    element.stopBtn.disabled =
      false;

    element.downloadBtn.href =
      url;

    element.downloadBtn.style.display =
      "inline-block";


    element.playBtn.onclick =
      async function() {

        try {

          await element.audio.play();

        } catch (error) {

          console.error(
            "PLAY ERROR:",
            error
          );

        }

      };


    element.stopBtn.onclick =
      function() {

        element.audio.pause();

        element.audio.currentTime =
          0;

      };


    element.voiceStatus.className =
      "voice-status ok";

    element.voiceStatus.textContent =
      "✅ Scene " +
      scene.number +
      " voice तयार झाली.";


    return true;

  } catch (error) {

    console.error(
      "VOICE ERROR:",
      error
    );

    element.voiceStatus.className =
      "voice-status bad";

    element.voiceStatus.textContent =
      "❌ Scene " +
      scene.number +
      " voice error: " +
      (error.message || error);

    return false;
  }
}


/* =====================================================
   GENERATE ALL
===================================================== */

async function generateAll(scenes, elements) {

  let imageSuccess = 0;
  let voiceSuccess = 0;
  let failed = 0;


  for (let i = 0; i < scenes.length; i++) {

    const scene =
      scenes[i];

    const element =
      elements[i];


    setStatus(
      "🎨 Scene " +
      scene.number +
      " / 8\n\n" +
      "Image + Voice तयार होत आहेत...\n\n" +
      "Images: " +
      imageSuccess +
      " / 8\n" +
      "Voice: " +
      voiceSuccess +
      " / 8"
    );


    const imageOK =
      await generateImage(
        scene,
        element
      );


    if (imageOK) {
      imageSuccess++;
    } else {
      failed++;
    }


    const voiceOK =
      await generateVoice(
        scene,
        element
      );


    if (voiceOK) {
      voiceSuccess++;
    } else {
      failed++;
    }


    setProgress(
      i + 1,
      scenes.length
    );
  }


  if (
    imageSuccess === 8 &&
    voiceSuccess === 8
  ) {

    setStatus(
      "🎉 पूर्ण झाले!\n\n" +
      "Images: 8 / 8\n" +
      "Voice: 8 / 8\n\n" +
      "प्रत्येक Scene खाली Play आणि Download MP3 उपलब्ध आहे.",
      "success"
    );

  } else {

    setStatus(
      "⚠️ Generation पूर्ण झाली.\n\n" +
      "Images: " +
      imageSuccess +
      " / 8\n" +
      "Voice: " +
      voiceSuccess +
      " / 8\n" +
      "Failed: " +
      failed,
      failed > 0 ? "error" : "normal"
    );

  }
}


/* =====================================================
   CREATE STORY
===================================================== */

async function createStory() {

  const story =
    storyInput.value.trim();


  if (!story) {

    setStatus(
      "कृपया आधी Story लिहा.",
      "error"
    );

    return;
  }


  createBtn.disabled =
    true;

  createBtn.textContent =
    "⏳ तयार होत आहे...";


  storyOutput.textContent =
    "कृपया थांबा...";


  scenesOutput.innerHTML =
    '<div class="loading">🤖 AI 8 scenes तयार करत आहे...</div>';


  setProgress(0, 8);


  setStatus(
    "🤖 Story AI कडे पाठवत आहे..."
  );


  try {

    const response =
      await fetch(
        BACKEND_URL,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "generate-story",
            story: story,
            language: languageInput.value,
            duration: durationInput.value,
            style: styleInput.value
          })
        }
      );


    const raw =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(raw);

    } catch (error) {

      throw new Error(
        "Backend ने valid JSON दिले नाही.\n\n" +
        raw.substring(0, 500)
      );
    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Story generation failed. HTTP " +
        response.status
      );
    }


    const aiStory =
      extractStory(data);


    if (!aiStory) {

      throw new Error(
        "AI response मध्ये Story सापडली नाही.\n\n" +
        JSON.stringify(data).substring(0, 1000)
      );
    }


    const cleanStory =
      cleanStoryText(aiStory);


    storyOutput.textContent =
      cleanStory;


    const scenes =
      parseScenes(cleanStory);


    if (scenes.length !== 8) {

      throw new Error(
        "AI response मध्ये पूर्ण 8 scenes सापडले नाहीत.\n\n" +
        "मिळाले: " +
        scenes.length +
        " / 8\n\n" +
        cleanStory.substring(0, 3000)
      );
    }


    for (let i = 0; i < 8; i++) {

      if (
        scenes[i].number !== i + 1
      ) {

        throw new Error(
          "Scene numbering चुकीचे आहे."
        );
      }
    }


    const elements =
      renderScenes(scenes);


    setStatus(
      "✅ 8 scenes तयार झाले!\n\n" +
      "आता Images + Voice तयार होत आहेत.\n\n" +
      "कृपया Browser बंद करू नका."
    );


    await generateAll(
      scenes,
      elements
    );


  } catch (error) {

    console.error(
      "CREATE STORY ERROR:",
      error
    );


    storyOutput.textContent =
      "Story तयार झाली नाही.";


    scenesOutput.innerHTML =
      "<p class='small'>❌ Scenes तयार झाले नाहीत.</p>";


    setProgress(0, 8);


    setStatus(
      "❌ समस्या आली.\n\n" +
      (error.message || error),
      "error"
    );

  } finally {

    createBtn.disabled =
      false;

    createBtn.textContent =
      "🎬 CREATE STORY";
  }
}


/* =====================================================
   BUTTON EVENT
===================================================== */

createBtn.addEventListener(
  "click",
  createStory
);


/* =====================================================
   PAGE READY
===================================================== */

console.log(
  "Apna Creator AI ready."
