
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apna Creator AI - 3D Character Lab</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#edf2fa;color:#172033;font-family:Arial}
.wrap{max-width:1050px;margin:auto;padding:16px}
.card{background:white;border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 4px 15px #14213d12}
h1{font-size:25px;margin:0 0 8px}
.sub,.note{color:#64748b;font-size:13px;line-height:1.5}
#stage{height:500px;width:100%;border-radius:12px;overflow:hidden;background:#a9d8f3}
#stage canvas{display:block;width:100%;height:100%}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
button{border:0;border-radius:8px;padding:12px 16px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
button.active{background:#15803d}
button:disabled{opacity:.5}
#status{background:#eff6ff;padding:12px;border-radius:8px;margin-top:12px;font-size:14px;white-space:pre-wrap}
@media(max-width:600px){#stage{height:390px}.wrap{padding:8px}}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div class="wrap">

<div class="card">
<h1>🎬 Apna Creator AI – 3D Character Lab</h1>
<p class="sub">Real GLB Character | Rigged Animation Test</p>

<div id="stage"></div>

<div class="controls">
<button id="idleBtn">Idle</button>
<button id="walkBtn" class="active">Walk</button>
<button id="runBtn">Run</button>
<button id="waveBtn">Wave</button>
<button id="jumpBtn">Jump</button>
<button id="flyBtn">Parrot Fly</button>
<button id="resetBtn">Reset</button>
</div>

<div id="status">Loading 3D Character...</div>
</div>

<div class="card">
<h3>Real 3D Character – Test</h3>
<p class="note">
GLB Model with its original skeleton and five animation clips:
Idle, Walk, Run, Wave and Jump.
</p>
<p class="note">
Character file: grab3d-cozy-character.glb
</p>
</div>

</div>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const stage=document.getElementById("stage");
const status=document.getElementById("status");

let renderer;

try{
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"low-power"});
}catch(error){
 status.textContent="WebGL is not available in this browser.";
 throw error;
}

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9d8f3);
scene.fog=new THREE.Fog(0xa9d8f3,15,35);

const camera=new THREE.PerspectiveCamera(
 40,
 stage.clientWidth/stage.clientHeight,
 .1,100
);
camera.position.set(3.1,2.8,7.5);
camera.lookAt(0,1,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x64744d,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-4,8,6);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

function material(color){
 return new THREE.MeshStandardMaterial({
  color,
  roughness:.8
 });
}

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(60,60),
 material(0x79ae5e)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.02;
ground.receiveShadow=true;
scene.add(ground);

// Trees
function addTree(x,z,height){
 const tree=new THREE.Group();
 tree.position.set(x,0,z);
 scene.add(tree);

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.18,height,12),
  material(0x76502e)
 );
 trunk.position.y=height/2;
 trunk.castShadow=true;
 tree.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(.85,18,14),
  material(0x34854b)
 );
 leaves.position.y=height+.35;
 leaves.scale.set(1,1.2,.9);
 leaves.castShadow=true;
 tree.add(leaves);
}

addTree(-3,-2,2);
addTree(3.2,-3,2.5);
addTree(-4,-5,2.2);

// Character loader
const MODEL_URL="./grab3d-cozy-character.glb";
const loader=new GLTFLoader();

let character=null;
let mixer=null;
let currentAction=null;
let currentAnimation="";
let animationActions={};

const clock=new THREE.Clock();

function playAnimation(name){

 if(!animationActions[name]){
  status.textContent=
   "Animation not found: "+name+
   "\nAvailable: "+Object.keys(animationActions).join(", ");
  return;
 }

 const next=animationActions[name];

 if(currentAction===next)return;

 if(currentAction){
  currentAction.fadeOut(.18);
 }

 next.reset();
 next.enabled=true;
 next.setEffectiveTimeScale(1);

 if(name==="jump"){
  next.setLoop(THREE.LoopOnce,1);
  next.clampWhenFinished=true;
 }else{
  next.setLoop(THREE.LoopRepeat,Infinity);
  next.clampWhenFinished=false;
 }

 next.fadeIn(.18).play();

 currentAction=next;
 currentAnimation=name;

 status.textContent=
  "✅ Playing: "+name.toUpperCase();
}

loader.load(
 MODEL_URL,

 function(gltf){

  character=gltf.scene;

  character.traverse(object=>{
   if(object.isMesh){
    object.castShadow=true;
    object.receiveShadow=true;
   }
  });

  scene.add(character);

  // Fit model to the scene automatically
  character.updateMatrixWorld(true);

  const initialBox=new THREE.Box3().setFromObject(character);
  const size=initialBox.getSize(new THREE.Vector3());

  const desiredHeight=2.2;
  const scale=desiredHeight/(size.y||1);

  character.scale.setScalar(scale);
  character.updateMatrixWorld(true);

  const finalBox=new THREE.Box3().setFromObject(character);
  const center=finalBox.getCenter(new THREE.Vector3());

  character.position.set(
   -1.0-center.x,
   -finalBox.min.y,
   -center.z
  );

  // Create the animation mixer
  mixer=new THREE.AnimationMixer(character);

  gltf.animations.forEach(clip=>{
   const key=clip.name.toLowerCase();
   animationActions[key]=mixer.clipAction(clip);
  });

  mixer.addEventListener("finished",event=>{
   if(event.action===currentAction && currentAnimation==="jump"){
    playAnimation("idle");
   }
  });

  const available=Object.keys(animationActions);

  status.textContent=
   "✅ 3D Character loaded!\n"+
   "Animations: "+available.join(", ");

  playAnimation("idle");
  document.getElementById("walkBtn").classList.add("active");
 },

 undefined,

 function(error){
  console.error("GLB loading error:",error);
  status.textContent=
   "❌ Character load failed.\n"+
   "Check GitHub Pages deployment and GLB file URL:\n"+
   MODEL_URL;
 }
);

// Simple parrot for the scene
const parrot=new THREE.Group();
parrot.position.set(1.65,1.65,0);
scene.add(parrot);

function birdSphere(pos,scale,color){
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(1,16,12),
  material(color)
 );
 mesh.position.set(...pos);
 mesh.scale.set(...scale);
 mesh.castShadow=true;
 parrot.add(mesh);
 return mesh;
}

birdSphere([0,0,0],[.23,.30,.20],0x2caa4d);
birdSphere([0,.29,.04],[.24,.24,.22],0x35b85b);
birdSphere([0,-.04,.17],[.16,.18,.07],0xf1c42c);
birdSphere([.12,.34,.20],[.045,.06,.03],0xffffff);
birdSphere([.13,.34,.23],[.02,.03,.02],0x151515);

const beak=new THREE.Mesh(
 new THREE.ConeGeometry(.08,.18,10),
 material(0xff9f27)
);
beak.position.set(0,.18,.28);
beak.rotation.x=Math.PI/2;
parrot.add(beak);

const wings=[];

for(const side of [-1,1]){
 const wing=new THREE.Group();
 wing.position.set(side*.19,.02,0);
 parrot.add(wing);

 const feather=new THREE.Mesh(
  new THREE.SphereGeometry(1,14,10),
  material(0x168c43)
 );
 feather.scale.set(.25,.08,.13);
 feather.position.x=side*.13;
 wing.add(feather);

 wings.push({wing,side});
}

const branch=new THREE.Mesh(
 new THREE.CylinderGeometry(.045,.055,1.25,12),
 material(0x704a2c)
);
branch.rotation.z=Math.PI/2;
branch.position.set(1.65,1.39,-.03);
scene.add(branch);

let parrotFlying=false;

function setButton(id){
 document.querySelectorAll(".controls button").forEach(button=>{
  button.classList.remove("active");
 });
 document.getElementById(id+"Btn").classList.add("active");
}

document.getElementById("idleBtn").onclick=()=>{
 setButton("idle");
 playAnimation("idle");
};

document.getElementById("walkBtn").onclick=()=>{
 setButton("walk");
 playAnimation("walk");
};

document.getElementById("runBtn").onclick=()=>{
 setButton("run");
 playAnimation("run");
};

document.getElementById("waveBtn").onclick=()=>{
 setButton("wave");
 playAnimation("wave");
};

document.getElementById("jumpBtn").onclick=()=>{
 setButton("jump");
 playAnimation("jump");
};

document.getElementById("flyBtn").onclick=()=>{
 parrotFlying=!parrotFlying;
 status.textContent=parrotFlying
  ?"🦜 Parrot Flying"
  :"🦜 Parrot Back on Branch";
};

document.getElementById("resetBtn").onclick=()=>{
 parrotFlying=false;
 setButton("idle");
 playAnimation("idle");
};

function animate(){
 requestAnimationFrame(animate);

 const delta=Math.min(clock.getDelta(),.05);
 const time=clock.elapsedTime;

 if(mixer){
  mixer.update(delta);
 }

 wings.forEach(({wing,side})=>{
  wing.rotation.z=
   Math.sin(time*12)*.55*side;
 });

 if(parrotFlying){
  parrot.position.x=1.65+Math.sin(time*1.5)*.8;
  parrot.position.y=1.85+Math.sin(time*3)*.3;
 }else{
  parrot.position.set(1.65,1.65+Math.sin(time*2)*.025,0);
 }

 renderer.render(scene,camera);
}

function resize(){
 const width=stage.clientWidth;
 const height=stage.clientHeight;

 camera.aspect=width/height;
 camera.updateProjectionMatrix();
 renderer.setSize(width,height);
}

window.addEventListener("resize",resize);

animate();
</script>

</body>
</html>
