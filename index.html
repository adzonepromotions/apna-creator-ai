<script>

/* =====================================================
   BACKEND
===================================================== */

const BACKEND_URL =
"https://apna-creator-ai.apnacreatorai.workers.dev/";


/* =====================================================
   ELEMENTS
===================================================== */

const storyInput =
document.getElementById("story");

const languageInput =
document.getElementById("language");

const durationInput =
document.getElementById("duration");

const styleInput =
document.getElementById("style");

const createBtn =
document.getElementById("createBtn");

const statusBox =
document.getElementById("status");

const storyOutput =
document.getElementById("storyOutput");

const scenesOutput =
document.getElementById("scenesOutput");

const progressBar =
document.getElementById("progressBar");


/* =====================================================
   STATUS
===================================================== */

function setStatus(text,type="normal"){

  statusBox.textContent =
    text;

  statusBox.className =
    "status";

  if(type === "error"){
    statusBox.classList.add("error");
  }

  if(type === "success"){
    statusBox.classList.add("success");
  }
}


/* =====================================================
   PROGRESS
===================================================== */

function setProgress(
  completed,
  total=8
){

  const percent =
    total > 0
      ? Math.round(
          (completed / total) * 100
        )
      : 0;

  progressBar.style.width =
    percent + "%";
}


/* =====================================================
   EXTRACT STORY
===================================================== */

function extractStory(data){

  if(!data){
    return "";
  }

  if(typeof data === "string"){
    return data.trim();
  }

  const fields = [

    data.story,
    data.text,
    data.output,
    data.response,
    data.result,
    data.content

  ];

  for(
    const value of fields
  ){

    if(
      typeof value === "string" &&
      value.trim()
    ){

      return value.trim();

    }

  }


  if(
    data.response &&
    typeof data.response === "object"
  ){

    const nested =
      extractStory(
        data.response
      );

    if(nested){
      return nested;
    }

  }


  if(Array.isArray(data)){

    for(
      const item of data
    ){

      const nested =
        extractStory(item);

      if(nested){
        return nested;
      }

    }

  }

  return "";
}


/* =====================================================
   CLEAN STORY
===================================================== */

function cleanStoryText(text){

  let result =
    String(text || "")
      .trim();


  result =
    result
      .replace(/```json/gi,"")
      .replace(/```text/gi,"")
      .replace(/```markdown/gi,"")
      .replace(/```/g,"")
      .trim();


  const scene1 =
    result.match(
      /(?:^|\n)\s*SCENE\s*1\b/i
    );


  if(scene1){

    result =
      result.substring(
        scene1.index +
        (
          scene1[0].startsWith("\n")
            ? 1
            : 0
        )
      ).trim();

  }


  result =
    result.replace(
      /\n+\s*(Here is the output|I will make sure|Please let me know|Hope this helps)[\s\S]*$/i,
      ""
    ).trim();


  return result;
}


/* =====================================================
   PARSE 8 SCENES
===================================================== */

function parseScenes(text){

  const scenes = [];

  const source =
    String(text || "")
      .replace(/\r/g,"")
      .trim();


  const sceneRegex =
    /(?:^|\n)\s*SCENE\s*([1-8])\s*:?\s*\n\s*Visual\s*:\s*([\s\S]*?)\n\s*Voice\s*:\s*([\s\S]*?)(?=\n\s*SCENE\s*[1-8]\s*:?\s*\n|$)/gi;


  let match;


  while(
    (match =
      sceneRegex.exec(
        source
      )) !== null
  ){

    const number =
      Number(match[1]);


    let visual =
      String(match[2] || "")
        .replace(/\*\*/g,"")
        .replace(/```/g,"")
        .replace(/\s+/g," ")
        .trim();


    let voice =
      String(match[3] || "")
        .replace(/\*\*/g,"")
        .replace(/```/g,"")
        .replace(/\s+/g," ")
        .trim();


    voice =
      voice.replace(
        /(?:Here is the output|I will make sure|Please let me know|STOP)[\s\S]*$/i,
        ""
      ).trim();


    if(
      number >= 1 &&
      number <= 8 &&
      visual &&
      voice
    ){

      scenes.push({

        number,
        visual,
        voice

      });

    }

  }


  const unique = [];


  for(
    const scene of scenes
  ){

    if(
      !unique.some(
        item =>
          item.number === scene.number
      )
    ){

      unique.push(scene);

    }

  }


  unique.sort(
    (a,b) =>
      a.number - b.number
  );


  return unique;
}


/* =====================================================
   RENDER SCENES
===================================================== */

function renderScenes(scenes){

  scenesOutput.innerHTML =
    "";

  const elements = [];


  for(
    const scene of scenes
  ){

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "scene";


    /* -----------------------------------------------
       TITLE
    ------------------------------------------------ */

    const h =
      document.createElement(
        "h3"
      );

    h.textContent =
      "🎬 SCENE " +
      scene.number;


    /* -----------------------------------------------
       VISUAL
    ------------------------------------------------ */

    const visual =
      document.createElement(
        "p"
      );

    const visualBold =
      document.createElement(
        "b"
      );

    visualBold.textContent =
      "Visual: ";

    visual.appendChild(
      visualBold
    );

    visual.appendChild(
      document.createTextNode(
        scene.visual
      )
    );


    /* -----------------------------------------------
       VOICE TEXT
    ------------------------------------------------ */

    const voice =
      document.createElement(
        "p"
      );

    const voiceBold =
      document.createElement(
        "b"
      );

    voiceBold.textContent =
      "Voice: ";

    voice.appendChild(
      voiceBold
    );

    voice.appendChild(
      document.createTextNode(
        scene.voice
      )
    );


    /* -----------------------------------------------
       IMAGE
    ------------------------------------------------ */

    const imageBox =
      document.createElement(
        "div"
      );

    imageBox.className =
      "image-box";

    imageBox.textContent =
      "⏳ Image तयार होत आहे...";


    /* -----------------------------------------------
       IMAGE STATUS
    ------------------------------------------------ */

    const imageStatus =
      document.createElement(
        "div"
      );

    imageStatus.className =
      "image-status";

    imageStatus.textContent =
      "⏳ Waiting...";


    /* -----------------------------------------------
       VOICE BOX
    ------------------------------------------------ */

    const voiceBox =
      document.createElement(
        "div"
      );

    voiceBox.className =
      "voice-box";


    const voiceTitle =
      document.createElement(
        "div"
      );

    voiceTitle.innerHTML =
      '<span class="badge">🔊 VOICE</span>';


    const voiceStatus =
      document.createElement(
        "div"
      );

    voiceStatus.className =
      "voice-status";

    voiceStatus.textContent =
      "⏳ Voice तयार होण्याची वाट पाहत आहे...";


    const audio =
      document.createElement(
        "audio"
      );

    audio.controls =
      true;

    audio.style.display =
      "none";


    const buttons =
      document.createElement(
        "div"
      );

    buttons.className =
      "voice-buttons";


    const playBtn =
      document.createElement(
        "button"
      );

    playBtn.className =
      "play-btn";

    playBtn.textContent =
      "▶️ Play Voice";

    playBtn.disabled =
      true;


    const stopBtn =
      document.createElement(
        "button"
      );

    stopBtn.className =
      "stop-btn";

    stopBtn.textContent =
      "⏹️ Stop";

    stopBtn.disabled =
      true;


    const downloadBtn =
      document.createElement(
        "button"
      );

    downloadBtn.className =
      "download-btn";

    downloadBtn.textContent =
      "⬇️ Download MP3";

    downloadBtn.disabled =
      true;


    buttons.appendChild(
      playBtn
    );

    buttons.appendChild(
      stopBtn
    );

    buttons.appendChild(
      downloadBtn
    );


    voiceBox.appendChild(
      voiceTitle
    );

    voiceBox.appendChild(
      voiceStatus
    );

    voiceBox.appendChild(
      audio
    );

    voiceBox.appendChild(
      buttons
    );


    /* -----------------------------------------------
       APPEND
    ------------------------------------------------ */

    div.appendChild(h);

    div.appendChild(
      visual
    );

    div.appendChild(
      voice
    );

    div.appendChild(
      imageBox
    );

    div.appendChild(
      imageStatus
    );

    div.appendChild(
      voiceBox
    );


    scenesOutput.appendChild(
      div
    );


    elements.push({

      imageBox,
      imageStatus,

      voiceStatus,
      audio,

      playBtn,
      stopBtn,
      downloadBtn,

      voiceURL:null

    });

  }


  return elements;
}


/* =====================================================
   GENERATE IMAGE
===================================================== */

async function generateImage(
  scene,
  elements
){

  elements.imageStatus.className =
    "image-status";

  elements.imageStatus.textContent =
    "🎨 Scene " +
    scene.number +
    " ची image तयार होत आहे...";


  elements.imageBox.innerHTML =
    '<div class="loading">🎨 Image generating...<br>कृपया थांबा.</div>';


  try{

    const response =
      await fetch(
        BACKEND_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            action:
              "generate-image",

            visual:
              scene.visual,

            language:
              languageInput.value,

            style:
              styleInput.value

          })

        }
      );


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if(!response.ok){

      const errorText =
        await response.text();

      let message =
        "Image generation failed. HTTP " +
        response.status;


      try{

        const errorData =
          JSON.parse(
            errorText
          );

        if(errorData.error){
          message =
            errorData.error;
        }

      }
      catch(e){}


      throw new Error(
        message
      );

    }


    if(
      !contentType.includes(
        "image/"
      )
    ){

      const errorText =
        await response.text();

      throw new Error(
        "Backend ने image ऐवजी response दिला: " +
        errorText.substring(
          0,
          300
        )
      );

    }


    const blob =
      await response.blob();


    const imageURL =
      URL.createObjectURL(
        blob
      );


    elements.imageBox.innerHTML =
      "";


    const img =
      document.createElement(
        "img"
      );

    img.src =
      imageURL;

    img.alt =
      "Scene " +
      scene.number +
      " Cartoon Image";


    elements.imageBox.appendChild(
      img
    );


    elements.imageStatus.className =
      "image-status image-success";

    elements.imageStatus.textContent =
      "✅ Scene " +
      scene.number +
      " image तयार झाली.";


    return true;

  }
  catch(error){

    console.error(
      "IMAGE ERROR:",
      error
    );


    elements.imageBox.innerHTML =
      "❌ Image तयार झाली नाही.";


    elements.imageStatus.className =
      "image-status image-error";

    elements.imageStatus.textContent =
      "❌ Scene " +
      scene.number +
      " error: " +
      (
        error.message ||
        error
      );


    return false;
  }
}


/* =====================================================
   GENERATE VOICE
===================================================== */

async function generateVoice(
  scene,
  elements
){

  elements.voiceStatus.className =
    "voice-status";

  elements.voiceStatus.textContent =
    "🔊 Scene " +
    scene.number +
    " ची voice तयार होत आहे...";


  elements.playBtn.disabled =
    true;

  elements.stopBtn.disabled =
    true;

  elements.downloadBtn.disabled =
    true;


  try{

    const response =
      await fetch(
        BACKEND_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            action:
              "generate-voice",

            text:
              scene.voice,

            language:
              languageInput.value

          })

        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      let message =
        "Voice generation failed. HTTP " +
        response.status;


      try{

        const errorData =
          JSON.parse(
            errorText
          );

        if(errorData.error){
          message =
            errorData.error;
        }

      }
      catch(e){}


      throw new Error(
        message
      );

    }


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if(
      !contentType.includes(
        "audio/"
      )
    ){

      const errorText =
        await response.text();

      throw new Error(
        "Backend ने audio ऐवजी response दिला: " +
        errorText.substring(
          0,
          300
        )
      );

    }


    const blob =
      await response.blob();


    const voiceURL =
      URL.createObjectURL(
        blob
      );


    elements.voiceURL =
      voiceURL;


    elements.audio.src =
      voiceURL;


    elements.audio.style.display =
      "block";


    /* -----------------------------------------------
       PLAY
    ------------------------------------------------ */

    elements.playBtn.disabled =
      false;

    elements.playBtn.onclick =
      function(){

        elements.audio.play();

      };


    /* -----------------------------------------------
       STOP
    ------------------------------------------------ */

    elements.stopBtn.disabled =
      false;

    elements.stopBtn.onclick =
      function(){

        elements.audio.pause();

        elements.audio.currentTime =
          0;

      };


    /* -----------------------------------------------
       DOWNLOAD
    ------------------------------------------------ */

    elements.downloadBtn.disabled =
      false;

    elements.downloadBtn.onclick =
      function(){

        const a =
          document.createElement(
            "a"
          );

        a.href =
          voiceURL;

        a.download =
          "Apna-Creator-AI-Scene-" +
          scene.number +
          ".mp3";

        document.body.appendChild(
          a
        );

        a.click();

        a.remove();

      };


    elements.voiceStatus.className =
      "voice-status voice-success";

    elements.voiceStatus.textContent =
      "✅ Scene " +
      scene.number +
      " voice तयार झाली.";


    return true;

  }
  catch(error){

    console.error(
      "VOICE ERROR:",
      error
    );


    elements.voiceStatus.className =
      "voice-status voice-error";

    elements.voiceStatus.textContent =
      "❌ Scene " +
      scene.number +
      " voice error: " +
      (
        error.message ||
        error
      );


    return false;
  }
}


/* =====================================================
   GENERATE ALL IMAGES + VOICES
===================================================== */

async function generateAllMedia(
  scenes,
  elements
){

  let imageSuccess =
    0;

  let voiceSuccess =
    0;

  let failed =
    0;


  for(
    let i=0;
    i<scenes.length;
    i++
  ){

    const scene =
      scenes[i];


    setStatus(
      "🎨 Scene " +
      scene.number +
      " / " +
      scenes.length +
      "\n\n" +
      "Image तयार होत आहे..."
    );


    const imageOK =
      await generateImage(
        scene,
        elements[i]
      );


    if(imageOK){
      imageSuccess++;
    }
    else{
      failed++;
    }


    setStatus(
      "🔊 Scene " +
      scene.number +
      " / " +
      scenes.length +
      "\n\n" +
      "Voice तयार होत आहे..."
    );


    const voiceOK =
      await generateVoice(
        scene,
        elements[i]
      );


    if(voiceOK){
      voiceSuccess++;
    }
    else{
      failed++;
    }


    setProgress(
      i + 1,
      scenes.length
    );

  }


  if(
    imageSuccess === 8 &&
    voiceSuccess === 8
  ){

    setStatus(
      "🎉 पूर्ण झाले!\n\n" +
      "✅ 8 Scenes\n" +
      "✅ 8 Cartoon Images\n" +
      "✅ 8 Voice Files\n\n" +
      "प्रत्येक Scene खाली Play आणि Download MP3 वापरू शकता.",
      "success"
    );

  }
  else{

    setStatus(
      "⚠️ Generation पूर्ण झाली.\n\n" +
      "Images: " +
      imageSuccess +
      " / 8\n" +
      "Voice: " +
      voiceSuccess +
      " / 8\n\n" +
      "Failed: " +
      failed,
      failed >= 16
        ? "error"
        : "normal"
    );

  }
}


/* =====================================================
   CREATE STORY
===================================================== */

async function createStory(){

  const story =
    storyInput.value.trim();


  if(!story){

    setStatus(
      "कृपया आधी Story लिहा.",
      "error"
    );

    return;
  }


  createBtn.disabled =
    true;

  createBtn.textContent =
    "⏳ STORY + IMAGES + VOICE...";


  storyOutput.textContent =
    "कृपया थोडा वेळ थांबा...";


  scenesOutput.innerHTML =
    '<div class="loading">🤖 AI 8 scenes तयार करत आहे...</div>';


  setProgress(
    0,
    8
  );


  setStatus(
    "🤖 तुमची Story AI कडे पाठवत आहे...\n\n" +
    "AI 8 connected scenes तयार करेल."
  );


  try{

    const response =
      await fetch(
        BACKEND_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            action:
              "generate-story",

            story:
              story,

            language:
              languageInput.value,

            duration:
              durationInput.value,

            style:
              styleInput.value

          })

        }
      );


    const raw =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(raw);

    }
    catch(e){

      throw new Error(
        "Backend ने valid JSON दिले नाही.\n\n" +
        raw.substring(
          0,
          500
        )
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "Story generation failed. HTTP " +
        response.status
      );

    }


    const aiStory =
      extractStory(
        data
      );


    if(!aiStory){

      throw new Error(
        "AI response मध्ये story सापडली नाही.\n\n" +
        JSON.stringify(
          data
        ).substring(
          0,
          1000
        )
      );

    }


    const cleanStory =
      cleanStoryText(
        aiStory
      );


    storyOutput.textContent =
      cleanStory;


    const scenes =
      parseScenes(
        cleanStory
      );


    if(
      scenes.length !== 8
    ){

      throw new Error(
        "AI response मध्ये पूर्ण 8 scenes सापडले नाहीत.\n\n" +
        "मिळाले: " +
        scenes.length +
        " / 8\n\n" +
        cleanStory.substring(
          0,
          3000
        )
      );

    }


    for(
      let i=0;
      i<8;
      i++
    ){

      if(
        scenes[i].number !==
        i + 1
      ){

        throw new Error(
          "Scene numbering चुकीचे आहे."
        );

      }

    }


    const elements =
      renderScenes(
        scenes
      );


    setStatus(
      "✅ 8 scenes तयार झाले!\n\n" +
      "🎨 Images आणि 🔊 Voice तयार होत आहेत.\n\n" +
      "Browser बंद करू नका."
    );


    await generateAllMedia(
      scenes,
      elements
    );

  }
  catch(error){

    console.error(
      "CREATE ERROR:",
      error
    );


    storyOutput.textContent =
      "Story तयार झाली नाही.";


    scenesOutput.innerHTML =
      '<p class="small">❌ Scenes तयार झाले नाहीत.</p>';


    setProgress(
      0,
      8
    );


    setStatus(
      "❌ समस्या आली.\n\n" +
      (
        error.message ||
        error
      ),
      "error"
    );

  }
  finally{

    createBtn.disabled =
      false;

    createBtn.textContent =
      "🎬 CREATE STORY";

  }
}


/* =====================================================
   BUTTON
===================================================== */

createBtn.addEventListener(
  "click",
  createStory
);

</script>

</body>
</html>
